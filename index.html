/* Ilustrasi fitur utama: adegan SVG yang lebih kaya dengan gerak lembut. */
#fitur .feature{padding:0 0 20px;overflow:hidden;background:linear-gradient(150deg,#fff 0%,#fffafd 100%);}
#fitur .feature-illustration{height:142px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;margin:0 0 17px;border-radius:18px 18px 0 0;isolation:isolate;}
#fitur .feature-illustration:before,#fitur .feature-illustration:after{content:"";position:absolute;border-radius:50%;pointer-events:none;z-index:-1;animation:featureBlob 7s ease-in-out infinite;}
#fitur .feature-illustration:before{width:118px;height:118px;left:-25px;top:-43px;background:#ffffff8c;}
#fitur .feature-illustration:after{width:94px;height:94px;right:-20px;bottom:-48px;background:#ffffffa6;animation-delay:-3.5s;}
#fitur .feature-illustration svg{height:136px;width:min(100%,230px);overflow:visible;filter:drop-shadow(0 5px 3px #8a78ad12);animation:featureSceneFloat 5s ease-in-out infinite;}
#fitur .feature h3,#fitur .feature p,#fitur .feature .feature-detail{margin-left:20px;margin-right:20px;}
#fitur .feature h3{font-size:15px;margin-bottom:8px;}
#fitur .feature p{font-size:12px;line-height:1.7;min-height:61px;}
#fitur .feature .feature-detail{display:inline-flex;align-items:center;gap:7px;margin-top:12px;font-size:10px;padding:7px 11px;border-radius:999px;background:#f4efff;color:#7954b1;font-weight:700;}
#fitur .feature .feature-detail:after{content:"➜";font-size:13px;transition:transform .2s ease;}
#fitur .feature:hover .feature-detail:after{transform:translateX(3px);}
.art-personal{background:linear-gradient(120deg,#ffe2f0,#f2e8ff)}.art-social{background:linear-gradient(120deg,#e4f2ff,#e8e9ff)}.art-learning{background:linear-gradient(120deg,#eee6ff,#fce7f5)}.art-career{background:linear-gradient(120deg,#fff0d5,#ffe5ed)}.art-library{background:linear-gradient(120deg,#ddf8ef,#e8f5ff)}.art-progress{background:linear-gradient(120deg,#e6edff,#ffe7f4)}
#fitur .art-spark{position:absolute;z-index:2;font-size:22px;color:#a184e5;animation:featureTwinkle 3.4s ease-in-out infinite;}
#fitur .spark-one{top:22px;left:20%;}#fitur .spark-two{right:16%;bottom:20px;animation-delay:-1.7s;}
#fitur .art-float-left{transform-origin:center;animation:featureCharacter 4s ease-in-out infinite;}#fitur .art-float-right{transform-origin:center;animation:featureCharacter 4.5s ease-in-out infinite reverse;}
@keyframes featureSceneFloat{0%,100%{transform:translateY(2px)}50%{transform:translateY(-5px)}}
@keyframes featureBlob{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(9px,-5px) scale(1.08)}}
@keyframes featureTwinkle{0%,100%{opacity:.45;transform:scale(.8) rotate(-8deg)}50%{opacity:1;transform:scale(1.15) rotate(12deg)}}
@keyframes featureCharacter{0%,100%{translate:0 0}50%{translate:0 -3px}}
@media(max-width:760px){#fitur .feature-illustration{height:125px}#fitur .feature-illustration svg{height:121px}#fitur .feature h3,#fitur .feature p,#fitur .feature .feature-detail{margin-left:13px;margin-right:13px}#fitur .feature p{min-height:unset}}

<script>
const $=s=>document.querySelector(s);
const app=$('#app');
const state={submissions:[],screen:'home',role:'teacher',page:'overview',studentName:'Aisyah Putri',studentClass:'VII A',search:'',filterLesson:'Semua Pembelajaran',filterClass:'Semua Kelas',lkpds:[],lessons:[
{id:1,title:'Mengenal Diri, Mengelola Emosi',desc:'Mengenali kekuatan diri, memahami emosi, dan membangun kebiasaan regulasi emosi.',field:'Pribadi',materi:1,lkpd:1,color:'linear-gradient(135deg,#ffe1ef,#e4e9ff)',icon:'person'},
{id:2,title:'Strategi Belajar Efektif',desc:'Mengembangkan fokus, motivasi, dan kebiasaan belajar yang teratur.',field:'Belajar',materi:2,lkpd:1,color:'linear-gradient(135deg,#dff3ff,#e9e0ff)',icon:'book'},
{id:3,title:'Komunikasi Positif dalam Pergaulan',desc:'Berlatih komunikasi asertif, empati, dan membangun pertemanan yang sehat.',field:'Sosial',materi:2,lkpd:1,color:'linear-gradient(135deg,#e7e0ff,#ffe4f1)',icon:'people'},
{id:4,title:'Jelajahi Minat dan Cita-Cita',desc:'Mengeksplorasi minat, potensi, dan langkah kecil untuk masa depan.',field:'Karier',materi:1,lkpd:1,color:'linear-gradient(135deg,#fff0d8,#ffe1ef)',icon:'star'}],
students:[],activities:[],materials:[]};
// Penyimpanan terpusat: Apps Script menyimpan data bersama di Google Sheets.
// Jika file dibuka sebagai HTML biasa, browser menyimpan data lokal pada perangkat ini.
let serverReady=false, isLoadingServer=false, localDirty=false, lastCentralUpdatedAt='', applyingRemoteState=false;
let localDirtyTimer=null, centralPollTimer=null;
function appData(){return {schemaVersion:3,students:state.students||[],lessons:state.lessons||[],lkpds:state.lkpds||[],materials:state.materials||[],submissions:state.submissions||[],activities:state.activities||[],teacherName:state.teacherName||'Putri Vara Diba'};}
function applyAppData(d){if(!d)return;['students','lessons','lkpds','submissions','activities','materials'].forEach(k=>{if(Array.isArray(d[k]))state[k]=d[k]});if(Array.isArray(state.materials)){const seen=new Set();state.materials=state.materials.filter(m=>{const key=String(m.id??'');if(key&&seen.has(key))return false;if(key)seen.add(key);return true;}).map(m=>{const ext=String(m.fileName||'').split('.').pop().toLowerCase();const typeByExt={pdf:'PDF',ppt:'PowerPoint',pptx:'PowerPoint',mp4:'Video',doc:'Word',docx:'Word',jpg:'Dokumen lainnya',jpeg:'Dokumen lainnya',png:'Dokumen lainnya',txt:'Link'};if(m.fileName&&typeByExt[ext])m.type=typeByExt[ext];return m;});}if(d.teacherName)state.teacherName=d.teacherName;}
// Semua modul SI-PENA BK menggunakan satu endpoint dan satu snapshot data bersama.
const CENTRAL_API_URL = 'https://script.google.com/macros/s/AKfycbyDBG9ecXvnhxKEHtAK-QzJ9e3C-oQqHTQfACdRjbWP25Kxm9wKkDBnXyDWtz2c7N9PXQ/exec';
function centralApiReady(){return /^https:\/\/script\.google\.com\/macros\/s\//.test(CENTRAL_API_URL)&&CENTRAL_API_URL.includes('/exec')&&!CENTRAL_API_URL.includes('ISI_URL');}
let centralSaveTimer=null;
function cacheLocalState(snapshot){try{localStorage.setItem('sipena_bk_state_v1',JSON.stringify(snapshot));}catch(e){console.warn('Penyimpanan lokal tidak tersedia',e)}}
function stableJson_(value){
 if(Array.isArray(value))return '['+value.map(stableJson_).join(',')+']';
 if(value&&typeof value==='object')return '{'+Object.keys(value).filter(k=>value[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+stableJson_(value[k])).join(',')+'}';

}
function sameSavedState_(expected, actual){
 if(!actual||Number(actual.schemaVersion)<3)return false;
 const keys=['students','lessons','lkpds','materials','submissions','activities'];
 return keys.every(k=>stableJson_(expected[k]||[])===stableJson_(actual[k]||[]));
}
function loadCentralMeta_(done){
 if(!centralApiReady()){done(null);return;}
 const cb='sipenaMeta_'+Date.now()+'_'+Math.random().toString(36).slice(2);
 let finished=false;
 const script=document.createElement('script');
 const cleanup=()=>{finished=true;try{delete window[cb]}catch(e){};if(script.parentNode)script.remove();};
 window[cb]=d=>{if(finished)return;cleanup();done(d&&d.ok?d.data:null);};
 script.onerror=()=>{if(finished)return;cleanup();done(null);};
 script.src=CENTRAL_API_URL+'?action=meta&callback='+cb+'&_='+Date.now();
 document.head.appendChild(script);
 setTimeout(()=>{if(!finished){cleanup();done(null);}},10000);
}
function verifyCentralSave_(snapshot, attempt, done){
 // Konfirmasi memakai metadata ringan; jangan unduh ulang snapshot besar hanya untuk verifikasi.
 loadCentralMeta_(meta=>{
   if(meta&&snapshot.clientSaveId&&meta.clientSaveId===snapshot.clientSaveId){
     lastCentralUpdatedAt=meta.updatedAt||lastCentralUpdatedAt;
     done(true,meta);
     return;
   }
   if(attempt<8){setTimeout(()=>verifyCentralSave_(snapshot,attempt+1,done),450);return;}
   done(false,meta||null);
 });
}
function persistState(onComplete){
 const snapshot=appData();
 snapshot.clientSaveId='sipena-'+Date.now()+'-'+Math.random().toString(36).slice(2);
 cacheLocalState(snapshot);
 if(isLoadingServer||applyingRemoteState){if(onComplete)onComplete(false);return;}
 if(!serverReady){console.warn('Perubahan belum dikirim karena database pusat belum siap.');if(onComplete)onComplete(false);return;}
 localDirty=true;
 if(localDirtyTimer)clearTimeout(localDirtyTimer);
 localDirtyTimer=null;
 if(centralSaveTimer)clearTimeout(centralSaveTimer);
 centralSaveTimer=setTimeout(()=>{
   const finish=(ok,remote)=>{
     if(ok){
       lastCentralUpdatedAt=(remote&&remote.updatedAt)||lastCentralUpdatedAt;
       const current=appData();
       if(sameSavedState_(snapshot,current)){
         localDirty=false;
       }else{
         // Ada perubahan baru ketika snapshot sebelumnya masih disimpan; kirim snapshot terbaru.
         localDirty=true;
         setTimeout(()=>persistState(),50);
       }
     }else{
       // Pertahankan penanda perubahan lokal agar polling tidak menimpa jawaban yang belum tersimpan.
       localDirty=true;
       console.warn('Data pusat belum mengonfirmasi snapshot terbaru.');
     }
     if(onComplete)onComplete(!!ok,remote);
     if(ok)setTimeout(syncCentralIfChanged,900);
   };
   if(window.google&&google.script&&google.script.run){
     google.script.run
       .withSuccessHandler(()=>verifyCentralSave_(snapshot,0,finish))
       .withFailureHandler(e=>{console.error('Sinkronisasi pusat gagal',e);toast('Sinkronisasi pusat gagal. Periksa koneksi lalu coba lagi.');finish(false,null);})
       .saveAppState(snapshot);
   }else if(centralApiReady()){
     try{
       const body=new URLSearchParams({action:'save',data:JSON.stringify(snapshot)});
       fetch(CENTRAL_API_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:body.toString()})
         .then(()=>verifyCentralSave_(snapshot,0,finish))
         .catch(e=>{console.warn('Sinkronisasi pusat gagal',e);toast('Sinkronisasi pusat gagal. Periksa koneksi lalu coba lagi.');finish(false,null);});
     }catch(e){console.warn('Sinkronisasi pusat gagal',e);finish(false,null);}
   }else finish(false,null);
 },250);
}
function loadCentralState(done, attempt=0){
 if(!centralApiReady()){done(null);return;}
 const cb='sipenaLoad_'+Date.now()+'_'+Math.random().toString(36).slice(2);
 let finished=false;
 const script=document.createElement('script');
 const cleanup=()=>{finished=true;try{delete window[cb]}catch(e){}if(script.parentNode)script.remove();};
 const finish=data=>{
   if(finished)return;
   cleanup();
   if(data&&data.ok&&data.data){done(data.data);return;}
   console.warn('SI-PENA BK: respons load tidak valid',data&&data.error||data);
   if(attempt<1){setTimeout(()=>loadCentralState(done,attempt+1),350);return;}
   done(null);
 };
 window[cb]=finish;
 script.onerror=()=>{
   if(finished)return;
   cleanup();
   console.warn('SI-PENA BK: permintaan load gagal pada percobaan',attempt+1);
   if(attempt<1){setTimeout(()=>loadCentralState(done,attempt+1),350);return;}
   done(null);
 };
 script.src=CENTRAL_API_URL+'?action=load&callback='+cb+'&_='+Date.now()+'_'+Math.random().toString(36).slice(2);
 document.head.appendChild(script);
 setTimeout(()=>{
   if(!finished){
     cleanup();
     console.warn('SI-PENA BK: load melewati batas waktu pada percobaan',attempt+1);
     if(attempt<1){setTimeout(()=>loadCentralState(done,attempt+1),350);return;}
     done(null);
   }
 },12000);
}

function loadCentralMaterialFile_(id,done,attempt=0){
 if(!centralApiReady()){done(null);return;}
 const cb='sipenaFile_'+Date.now()+'_'+Math.random().toString(36).slice(2);
 let finished=false;
 const script=document.createElement('script');
 const cleanup=()=>{finished=true;try{delete window[cb]}catch(e){}if(script.parentNode)script.remove();};
 const finish=data=>{
   if(finished)return;
   cleanup();
   if(data&&data.ok&&data.data&&data.data.fileData){done(data.data);return;}
   console.warn('SI-PENA BK: file materi tidak tersedia',data&&data.error||data);
   if(attempt<1){setTimeout(()=>loadCentralMaterialFile_(id,done,attempt+1),350);return;}
   done(null);
 };
 window[cb]=finish;
 script.onerror=()=>{
   if(finished)return;
   cleanup();
   if(attempt<1){setTimeout(()=>loadCentralMaterialFile_(id,done,attempt+1),350);return;}
   done(null);
 };
 script.src=CENTRAL_API_URL+'?action=file&id='+encodeURIComponent(id)+'&callback='+cb+'&_='+Date.now()+'_'+Math.random().toString(36).slice(2);
 document.head.appendChild(script);
 setTimeout(()=>{
   if(!finished){
     cleanup();
     if(attempt<1){setTimeout(()=>loadCentralMaterialFile_(id,done,attempt+1),350);return;}
     done(null);

function materialObjectUrl_(dataUri){
 try{
   const match=String(dataUri||'').match(/^data:([^;,]+)?(;base64)?,([\s\S]*)$/);
   if(!match)return dataUri;
   const mime=match[1]||'application/octet-stream';
   const payload=match[3]||'';
   let blob;
   if(match[2]){
     const binary=atob(payload);const bytes=new Uint8Array(binary.length);
     for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
     blob=new Blob([bytes],{type:mime});
   }else blob=new Blob([decodeURIComponent(payload)],{type:mime});
   return URL.createObjectURL(blob);
 }catch(e){console.warn('Tidak dapat membuat tautan file lokal',e);return dataUri;}
}
function syncCentralIfChanged(){
 if(!serverReady||isLoadingServer||localDirty||document.querySelector('.modal-backdrop'))return;
 // Poll metadata first. The full data snapshot is fetched only when central data changed.
 loadCentralMeta_(meta=>{
   if(!meta||!meta.updatedAt||meta.updatedAt===lastCentralUpdatedAt)return;
   loadCentralState(d=>{
     if(!d||!Number(d.schemaVersion)||!d.updatedAt)return;
     if(d.updatedAt===lastCentralUpdatedAt)return;
     applyAppData(d);
     lastCentralUpdatedAt=d.updatedAt;
     cacheLocalState(appData());
     applyingRemoteState=true;
     try{if(state.screen==='dashboard')renderDashboard();else home();}
     finally{applyingRemoteState=false;}
   });
 });
}
function startCentralPolling(){if(centralPollTimer)clearInterval(centralPollTimer);centralPollTimer=setInterval(syncCentralIfChanged,5000)}
function centralStateHasData(d){return !!d&&['students','lessons','lkpds','materials','submissions','activities'].some(k=>Array.isArray(d[k])&&d[k].length>0);}
function mergeInitialData(central,local){
 const result={};const keys=['students','lessons','lkpds','materials','submissions','activities'];
 const keyFor=(kind,x)=>{
   if(kind==='students')return String(x.name||x.studentName||'').trim().toLowerCase()+'|'+String(x.kelas||x.studentClass||'').trim().toLowerCase();
   if(kind==='submissions')return String(x.id||'')||[x.kind,x.studentName,x.studentClass,x.lkpdId,x.lessonId,x.submittedAt].join('|');
   // LKPD/materi yang dibuat di perangkat berbeda bisa memakai nomor ID lokal yang sama.
   // Identitas utamanya memakai judul + konteks, bukan ID lokal saja.
   if(kind==='materials')return [String(x.title||'').trim().toLowerCase(),String(x.category||'materi'),String(x.url||''),String(x.fileName||'')].join('|');
   if(kind==='lkpds')return [String(x.title||'').trim().toLowerCase(),String(x.lessonId||''),String(x.type||'')].join('|');
   if(kind==='lessons')return [String(x.title||'').trim().toLowerCase(),String(x.field||'')].join('|');
   return String(x.id||'')||JSON.stringify(x);
 };
 keys.forEach(k=>{
   const c=Array.isArray(central&&central[k])?central[k]:[];
   const l=Array.isArray(local&&local[k])?local[k]:[];
   const out=c.map(x=>({...x}));const seen=new Set(out.map(x=>keyFor(k,x)));
   l.forEach(x=>{const key=keyFor(k,x);if(!seen.has(key)){out.push({...x});seen.add(key)}});
   // Jaga ID tetap unik jika dua perangkat membuat item baru dengan nomor lokal sama.
   if(k==='lkpds'||k==='materials'){
     const ids=new Set();let next=Math.max(0,...out.map(x=>Number(x.id)||0));
     out.forEach(x=>{const id=String(x.id??'');if(!id||ids.has(id)){next+=1;x.id=next;}ids.add(String(x.id));});
   }
   result[k]=out;
 });
 result.teacherName=(central&&central.teacherName)||(local&&local.teacherName)||state.teacherName||'Putri Vara Diba';
 result.schemaVersion=3;
 return result;
}
function startApp(){
 let local=null;
 try{local=JSON.parse(localStorage.getItem('sipena_bk_state_v1')||'null')}catch(e){}
 if(local)applyAppData(local);
 state.lkpds=(state.lkpds||[]).filter(k=>!['Refleksi Mengenal Diri','Latihan Komunikasi Asertif'].includes(k.title));
 if(!Array.isArray(state.students))state.students=[];
 const boot=()=>{if(!Array.isArray(state.students))state.students=[];home();};
 const migrateOrSeed=d=>{
   // Database pusat menjadi sumber kebenaran lintas akun/perangkat.
   // Cache lokal hanya digabung satu kali jika pusat belum pernah dimigrasikan.
   if(d&&Number(d.schemaVersion)>=2){
     applyAppData(d);
     lastCentralUpdatedAt=d.updatedAt||'';
     isLoadingServer=false;
     serverReady=true;
     cacheLocalState(appData());
     // Upgrade snapshot pusat versi 2 satu kali. Versi 3 tidak ditulis ulang
     // setiap kali halaman dibuka agar tidak membuat konflik lintas perangkat.
     if(Number(d.schemaVersion)<3)persistState();
     startCentralPolling();
     boot();
     return;
   }
   const migrated=mergeInitialData(d||{},local||appData());
   migrated.schemaVersion=3;
   applyAppData(migrated);
   lastCentralUpdatedAt=d&&d.updatedAt||'';
   isLoadingServer=false;
   serverReady=true;
   persistState();
   startCentralPolling();
   boot();
 };
 if(window.google&&google.script&&google.script.run){
   isLoadingServer=true;
   google.script.run.withSuccessHandler(d=>migrateOrSeed(d)).withFailureHandler(e=>{isLoadingServer=false;serverReady=false;boot();toast('Data pusat belum terbaca. Perubahan tidak akan dikirim agar data pusat tidak tertimpa. Muat ulang saat koneksi pulih.');}).loadAppState();
 }else if(centralApiReady()){
   isLoadingServer=true;
   loadCentralState(d=>{if(d)migrateOrSeed(d);else{isLoadingServer=false;serverReady=false;boot();toast('Data pusat belum terbaca. Perubahan tidak akan dikirim agar data pusat tidak tertimpa. Muat ulang saat koneksi pulih.');}});
 }else boot();
}

<section id="layanan" class="landing-service-section">
<div class="landing-section-title"><div><span class="landing-kicker">LAYANAN DALAM SATU RUANG</span><h2>Layanan SI-PENA BK</h2><p>SI-PENA BK menyediakan ruang layanan untuk dua pengguna utama. Guru BK dapat mengatur kebutuhan layanan dan meninjau hasil kegiatan, sedangkan peserta didik dapat mengikuti materi serta aktivitas yang sudah disediakan. Dengan alur yang tersusun, kegiatan layanan lebih mudah dipantau tanpa menghilangkan peran pendampingan langsung dari Guru BK.</p></div></div>
<div class="service-grid">
<article class="service-card service-teacher"><div class="service-art">${icons.teacher}<span class="service-orbit">✦</span></div><div class="service-copy"><span class="service-label">UNTUK GURU BK</span><h3>Pengelolaan layanan yang terarah</h3><p>Guru BK dapat mengelola identitas dan rombongan belajar peserta didik, menyusun serta memperbarui topik pembelajaran pada bidang pribadi, sosial, belajar, dan karier, serta menyiapkan LKPD sesuai tujuan layanan. Guru BK juga dapat mengelompokkan bahan pendukung di perpustakaan digital, memeriksa jawaban yang dikirim, melihat riwayat aktivitas, dan menggunakan hasil pemetaan kategori A/B/C sebagai salah satu bahan pertimbangan untuk menentukan tindak lanjut layanan.</p><ul><li>Data peserta didik dan kelas</li><li>Pengelolaan pembelajaran dan LKPD</li><li>Rekap hasil, kategori A/B/C, dan laporan</li></ul></div></article>
<article class="service-card service-student"><div class="service-art">${icons.student}<span class="service-orbit">✧</span></div><div class="service-copy"><span class="service-label">UNTUK PESERTA DIDIK</span><h3>Ruang belajar dan refleksi pribadi</h3><p>Peserta didik dapat masuk menggunakan akun yang telah didaftarkan Guru BK, lalu membuka pembelajaran yang tersedia sesuai bidang dan topiknya. Di dalam ruang siswa, mereka dapat membaca materi, mengerjakan LKPD yang diberikan, mengirim jawaban, serta melihat status pengiriman dan riwayat aktivitasnya. Ruang ini juga mendorong peserta didik melakukan refleksi dan mengenali langkah pengembangan diri berikutnya.</p><ul><li>Materi sesuai bidang dan topik BK</li><li>LKPD untuk dijawab secara daring</li><li>Riwayat aktivitas dan status pengiriman</li></ul></div></article>
</div></section>
<section id="fitur" class="landing-feature-section"><div class="landing-section-title"><div><span class="landing-kicker">FITUR PENDUKUNG</span><h2>Fitur yang Membantu Proses Layanan</h2><p>Setiap fitur dirancang untuk mendukung proses layanan dari perencanaan, pelaksanaan aktivitas, hingga peninjauan hasil. Fitur-fitur ini membantu Guru BK dan peserta didik menemukan kebutuhan layanan yang relevan dalam satu ruang digital.</p></div></div>

<section id="tentang" class="about-panel"><div class="about-illustration"><div class="about-book">${icons.book}</div><span class="about-spark spark-a">✦</span><span class="about-spark spark-b">✧</span><span class="about-orb"></span></div><div class="about-copy"><span class="landing-kicker">TENTANG SI-PENA BK</span><h2>Teknologi yang mendukung layanan BK yang lebih dekat dengan peserta didik</h2><p>SI-PENA BK (Sistem Informasi Pelayanan Bimbingan dan Konseling) merupakan ruang digital pendukung pelaksanaan layanan Bimbingan dan Konseling di sekolah. Platform ini dirancang untuk menghubungkan pengelolaan layanan oleh Guru BK dengan kegiatan belajar peserta didik, penyediaan materi, pengisian LKPD, refleksi, serta pemantauan aktivitas. Dengan alur yang teratur, informasi layanan diharapkan lebih mudah ditemukan dan dokumentasi kegiatan lebih tertata.</p><p>Platform ini berfungsi sebagai alat bantu, bukan pengganti hubungan pendampingan antara Guru BK dan peserta didik. Data serta hasil aktivitas tetap perlu ditinjau secara bijaksana, dengan memperhatikan konteks, kerahasiaan informasi, dan kebutuhan masing-masing peserta didik. Dengan demikian, teknologi dapat mendukung layanan yang lebih terorganisasi sekaligus tetap mengutamakan hubungan yang aman, hangat, dan berpusat pada peserta didik.</p><div class="about-points"><span>✓ Berpusat pada peserta didik</span><span>✓ Mendukung empat bidang BK</span><span>✓ Mendorong refleksi dan tindak lanjut</span></div></div></section>
<section class="landing-bottom-callout"><div><strong>Setiap langkah kecil adalah bagian dari perkembangan.</strong><p>Setiap peserta didik memiliki proses perkembangan yang berbeda. Melalui materi, aktivitas refleksi, dan pendampingan Guru BK, SI-PENA BK diharapkan membantu peserta didik mengambil langkah kecil yang bermakna—mulai dari mengenali diri, membangun kebiasaan baik, memperkuat relasi, hingga merencanakan masa depan.</p></div><button class="btn outlinebtn" onclick="login('student')">Masuk ke Ruang Siswa →</button></section>

function handleLoginSubmit(e){e.preventDefault();const role=state.role;try{if(role==='teacher'){const name=(document.getElementById('username')?.value||'').trim().replace(/\s+/g,' ');const pin=(document.getElementById('password')?.value||'').trim();if(name.toLowerCase()!=='putri vara diba'||pin!=='1313'){toast('Nama pengguna atau PIN belum sesuai.');return false;}state.teacherName='Putri Vara Diba';state.role='teacher';state.page='overview';dashboard();return false;}const name=(document.getElementById('studentName')?.value||'').trim();const code=(document.getElementById('accessCode')?.value||'').trim();const cls=document.getElementById('studentClass')?.value||'';const s=state.students.find(x=>String(x.name).toLowerCase()===name.toLowerCase()&&String(x.kelas)===cls);if(!s){toast('Nama dan rombel belum terdaftar. Masuk sebagai Guru BK dan tambahkan siswa terlebih dahulu.');return false;}if(code!=='1234'){toast('Kode akses siswa salah. Gunakan 1234 untuk pratinjau.');return false;}state.studentName=s.name;state.studentClass=s.kelas;state.role='student';state.page='studenthome';dashboard();return false;}catch(err){console.error('Kesalahan saat memproses login SI-PENA BK:',err);toast('Login belum berhasil karena ada kendala pada halaman. Muat ulang file revisi terbaru.');return false;}}

function overviewPage(){const totalLKPD=(state.submissions||[]).filter(a=>a.kind==='lkpd').length;return `<section class="overview-hero"><div class="overview-hero-copy"><div class="eyebrow">RUANG KENDALI LAYANAN BK</div><h2>Ringkasan Eksekutif <span class="gradient-text">SI-PENA BK</span></h2><p>Pantau pembelajaran, pengumpulan LKPD, dan pemetaan perkembangan peserta didik dalam satu ruang yang rapi dan mudah dipahami.</p></div><div class="overview-hero-art" aria-hidden="true"><div class="overview-art-paper">${icons.file}<i></i><i></i><i></i></div><div class="overview-art-chart"><b></b><b></b><b></b><b></b><b></b></div></div></section><div class="stat-grid overview-stat-grid">${stat('Peserta Didik',state.students.length,icons.peopleSmall,'#ffe5f1','#d83d91','Terdaftar')}${stat('Pembelajaran Aktif',state.lessons.length,icons.bookSmall,'#e7eaff','#7d63d9','Empat bidang BK')}${stat('Jawaban LKPD',totalLKPD,icons.file,'#e0faf3','#17a78e','Terkirim')}${stat('Materi Digital',state.materials.length,icons.folderSmall,'#fff0e4','#e48a4d','Perpustakaan')}</div><section class="panel overview-progress-panel"><div class="panel-head"><div><h3>Rekap Progress Pembelajaran</h3><p>Persentase pengumpulan LKPD pada empat bidang layanan BK.</p></div><span class="pill">4 Bidang BK</span></div><div class="chart">${['Pribadi','Belajar','Sosial','Karier'].map((field,i)=>{const related=state.lessons.filter(l=>l.field===field);const count=related.reduce((sum,l)=>sum+(state.submissions||[]).filter(a=>Number(a.lessonId)===Number(l.id)&&a.kind==='lkpd').length,0);const denom=related.length*Math.max(state.students.length,1);const v=denom?Math.min(100,Math.round(count/denom*100)):0;return `<div class="bar-group"><span class="bar-value">${v}%</span><div class="bar" style="height:${Math.max(v,3)}%;background:${['#36c2b5','#9476e9','#ff9a77','#70a3f5'][i]};opacity:${v?1:.5}"></div><span class="bar-label">${field}</span></div>`}).join('')}</div><div class="overview-note"><span class="overview-note-icon">✓</span><span>Persentase dihitung dari jawaban LKPD yang tercatat. Jika belum ada pengumpulan, progress tetap 0% dan akan berubah ketika siswa mengirim jawaban.</span></div></section><div class="dash-grid summary-charts"><section class="panel mapping-panel-wide"><div class="panel-head"><div><h3>Pemetaan Perkembangan Peserta Didik</h3><p>Distribusi kategori A, B, dan C dari peserta didik yang sudah dinilai.</p></div><span class="pill">Kategori A/B/C</span></div>${mappingPanel()}</section></div><div class="callout"><div><strong>Ruang aman untuk tumbuh, belajar, dan berkembang.</strong><p>Kelola layanan BK secara lebih terarah dengan dokumentasi yang rapi.</p></div><button class="btn outlinebtn" onclick="goPage('lessons')">Kelola Pembelajaran →</button></div>`}
function studentsPage(){return `<div class="toolbar"><input id="studentSearch" placeholder="⌕ Cari nama peserta didik..." value="${escapeHtml(state.search)}" oninput="state.search=this.value;refreshStudents()"><select id="classFilter" onchange="state.filterClass=this.value;refreshStudents()"><option>Semua Kelas</option>${[...new Set(state.students.map(s=>s.kelas))].map(c=>`<option ${state.filterClass===c?'selected':''}>${c}</option>`).join('')}</select><button class="btn primary" onclick="openStudentModal()">＋ Tambah Peserta Didik</button><button class="btn outlinebtn" onclick="downloadCSV('siswa')">${icons.download} Unduh CSV</button></div><div id="studentTable">${studentTable()}</div><p class="form-note">Data peserta didik ini digunakan sebagai daftar akun siswa untuk mengakses ruang belajar.</p>`}
function studentTable(){let list=state.students.filter(s=>(s.name.toLowerCase().includes(state.search.toLowerCase()))&&(state.filterClass==='Semua Kelas'||s.kelas===state.filterClass));return `<div class="table-wrap"><table><thead><tr><th>NAMA PESERTA DIDIK</th><th>KELAS</th><th>JENIS KELAMIN</th><th>STATUS</th><th>AKSI</th></tr></thead><tbody>${list.map(s=>`<tr><td><div class="namecell"><div class="mini-avatar">${initials(s.name)}</div><strong>${escapeHtml(s.name)}</strong></div></td><td>${escapeHtml(s.kelas)}</td><td><span class="gender-pill ${s.gender==='Perempuan'?'gender-female':s.gender==='Laki-laki'?'gender-male':'gender-empty'}">${s.gender==='Perempuan'?'Perempuan':s.gender==='Laki-laki'?'Laki-laki':'Belum diisi'}</span></td><td><span class="status ${s.status==='Selesai'?'done':s.status==='Proses'?'progress':'notyet'}">${escapeHtml(s.status||'Aktif')}</span></td><td><button class="btn outlinebtn tinybtn" onclick="viewStudent('${escapeJs(s.name)}')">Detail</button> <button class="btn softbtn tinybtn" onclick="deleteStudent('${escapeJs(s.name)}')">Hapus</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Belum ada data peserta didik. Tambahkan siswa terlebih dahulu.</td></tr>'}</tbody></table></div>`}

function refreshStudents(){const box=$('#studentTable');if(box)box.innerHTML=studentTable()}
function resultsPage(){
 const collected=(state.submissions||[]).filter(x=>x.kind==='lkpd').slice().sort((a,b)=>new Date(b.submittedAt)-new Date(a.submittedAt));
 const completedNames=new Set(collected.map(x=>x.studentName+'|'+x.studentClass));
 const pending=state.students.filter(s=>!completedNames.has(s.name+'|'+s.kelas)).length;
 const assessed=state.students.filter(s=>['A','B','C'].includes(String(s.score))).length;
 return `<section class="results-hero"><div class="results-hero-copy"><span class="pill">PUSAT EVALUASI SI-PENA BK</span><h2>Hasil & Evaluasi Peserta Didik</h2><p>Pantau jawaban LKPD, lihat respons siswa langsung, tinjau kategori A/B/C, dan buat laporan individu untuk setiap peserta didik.</p><div class="results-hero-tags"><span>${icons.file} Jawaban LKPD</span><span>${icons.chart} Kategori A/B/C</span><span>${icons.download} PDF Individu</span></div></div><div class="results-hero-art evaluation-art" aria-hidden="true"><svg viewBox="0 0 220 150" role="img" aria-label="Ilustrasi evaluasi peserta didik"><g class="eval-paper"><rect x="22" y="22" width="92" height="112" rx="13" fill="#fff" stroke="#d9c9fa" stroke-width="2"/><rect x="48" y="13" width="40" height="17" rx="7" fill="#9a76e6"/><path d="M40 53l6 6 10-12M65 53h32M40 76l6 6 10-12M65 76h32M40 99l6 6 10-12M65 99h25" stroke="#b49ae9" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><g class="eval-person"><circle cx="151" cy="55" r="22" fill="#ffd9b9"/><path d="M129 54q-3-26 22-27 23 2 22 28l-11-10-23 2z" fill="#51334f"/><path d="M117 124q4-40 34-40 32 0 37 40" fill="#e968ad"/><path d="M139 92l12 13 12-13" stroke="#fff" stroke-width="4" fill="none"/></g><circle cx="181" cy="111" r="20" fill="#baf0df"/><path d="M171 111l7 7 13-16" stroke="#1b9e7d" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="eval-spark">✦</span></div></section>
 <div class="results-stat-grid">${stat('Peserta Didik',state.students.length,icons.peopleSmall,'#ffe5f1','#d83d91','Terdaftar')}${stat('Jawaban LKPD Masuk',collected.length,icons.file,'#eee7ff','#8055d5','Pengumpulan tersimpan')}${stat('Belum Mengumpulkan',pending,icons.clock||icons.check,'#fff0df','#e28b4d','Per siswa terdaftar')}${stat('Sudah Berkategori',assessed,icons.check,'#e1f8ed','#239a79','Kategori A, B, atau C')}</div>
 <section class="panel results-table-panel"><div class="panel-head"><div><h3>Jawaban LKPD Peserta Didik</h3><p>Pilih “Lihat Jawaban” untuk membaca respons langsung di dashboard, tanpa harus membuka spreadsheet.</p></div><span class="pill">${collected.length} jawaban</span></div>
 <div class="toolbar results-toolbar"><input id="resultSearch" placeholder="⌕ Cari nama peserta didik..." oninput="filterResults()"><select id="resultLesson" onchange="filterResults()"><option>Semua Pembelajaran</option>${state.lessons.map(l=>`<option value="${l.id}">${escapeHtml(l.title)}</option>`).join('')}</select><select id="resultClass" onchange="filterResults()"><option>Semua Kelas</option>${[...new Set(state.students.map(s=>s.kelas))].map(c=>`<option>${escapeHtml(c)}</option>`).join('')}</select><select id="resultCategory" onchange="filterResults()"><option>Semua Kategori</option><option>A</option><option>B</option><option>C</option></select><button class="btn outlinebtn" onclick="printReport()">${icons.file} Laporan Keseluruhan</button><button class="btn primary" onclick="downloadCSV('hasil')">${icons.download} Unduh CSV</button></div>
 <div id="resultTable">${resultTable(state.students)}</div></section>`
}
function resultTable(data){
 const submissions=(state.submissions||[]).filter(x=>x.kind==='lkpd').slice().sort((a,b)=>new Date(b.submittedAt)-new Date(a.submittedAt));
 const rows=[];
 submissions.forEach(a=>{const st=state.students.find(s=>s.name===a.studentName&&s.kelas===a.studentClass)||{};const lesson=state.lessons.find(l=>String(l.id)===String(a.lessonId));rows.push({name:a.studentName,kelas:a.studentClass,lesson:lesson?.title||a.lkpdTitle||'LKPD',score:['A','B','C'].includes(String(st.score))?String(st.score):'Belum dinilai',submission:a,student:st,submittedAt:a.submittedAt})});
 data.forEach(st=>{if(!submissions.some(a=>a.studentName===st.name&&a.studentClass===st.kelas))rows.push({name:st.name,kelas:st.kelas,lesson:st.lesson||'Belum ada aktivitas',score:['A','B','C'].includes(String(st.score))?String(st.score):'Belum dinilai',student:st,submission:null,submittedAt:null})});
 const q=($('#resultSearch')?.value||'').toLowerCase(),l=$('#resultLesson')?.value||'Semua Pembelajaran',c=$('#resultClass')?.value||'Semua Kelas',cat=$('#resultCategory')?.value||'Semua Kategori';
 const filtered=rows.filter(r=>r.name.toLowerCase().includes(q)&&(c==='Semua Kelas'||r.kelas===c)&&(cat==='Semua Kategori'||String(r.score)===cat)&&(l==='Semua Pembelajaran'||String(r.submission?.lessonId)===String(l)||String(r.student?.lessonId)===String(l)||r.lesson===state.lessons.find(x=>String(x.id)===String(l))?.title));
 return `<div class="table-wrap"><table class="results-table"><thead><tr><th>NO.</th><th>NAMA SISWA</th><th>ROMBEL</th><th>LKPD / PEMBELAJARAN</th><th>WAKTU</th><th>KATEGORI</th><th>AKSI</th><th>LAPORAN INDIVIDU</th></tr></thead><tbody>${filtered.map((r,i)=>`<tr><td>${i+1}</td><td><div class="namecell"><div class="mini-avatar">${initials(r.name)}</div><strong>${escapeHtml(r.name)}</strong></div></td><td>${escapeHtml(r.kelas)}</td><td>${escapeHtml(r.lesson)}</td><td>${r.submittedAt?new Date(r.submittedAt).toLocaleString('id-ID'):'Belum mengumpulkan'}</td><td><span class="category-chip cat-${['A','B','C'].includes(String(r.score))?r.score:'none'}">${escapeHtml(r.score)}</span></td><td><div class="result-actions">${r.submission?`<button class="btn bluebtn tinybtn" onclick="viewSubmission(${r.submission.id})">${icons.eye||icons.file} Lihat Jawaban</button><button class="btn delete-answer-btn tinybtn" onclick="deleteSubmission(${r.submission.id})">${icons.trash||'×'} Hapus</button>`:'<span class="muted small">Belum ada jawaban</span>'}</div></td><td><button class="btn softbtn tinybtn" onclick="downloadStudentPDF('${escapeJs(r.name)}')">${icons.file} PDF Individu</button></td></tr>`).join('')||'<tr><td colspan="8" class="empty">Tidak ada data yang sesuai dengan filter.</td></tr>'}</tbody></table></div>`
}
function deleteSubmission(id){const a=(state.submissions||[]).find(x=>Number(x.id)===Number(id));if(!a)return;showModal(`<div class="form-header"><span class="pill">KONFIRMASI</span><h2>Hapus jawaban LKPD?</h2><p>Jawaban milik <b>${escapeHtml(a.studentName)}</b> untuk <b>${escapeHtml(a.lkpdTitle||'LKPD')}</b> akan dihapus dari data lokal aplikasi. Tindakan ini tidak dapat dibatalkan.</p></div><div class="modal-actions"><button class="btn softbtn" onclick="closeModal()">Batal</button><button class="btn primary" onclick="confirmDeleteSubmission(${Number(id)})">Ya, hapus jawaban</button></div>`)}
function confirmDeleteSubmission(id){state.submissions=(state.submissions||[]).filter(x=>Number(x.id)!==Number(id));persistState();closeModal();renderDashboard();toast('Jawaban LKPD berhasil dihapus dari data lokal.')}

function filterResults(){const box=$('#resultTable');if(box)box.innerHTML=resultTable(state.students)}
function categoryBadge(value){const c=['A','B','C'].includes(String(value||''))?String(value):'';return c?`<span class="category-badge cat-${c.toLowerCase()}">${c}</span>`:'<span class="category-badge cat-none">Belum dinilai</span>'}
function setSubmissionCategory(submissionId,category){if(!['A','B','C'].includes(category))return;const a=(state.submissions||[]).find(x=>Number(x.id)===Number(submissionId));if(!a)return;const s=(state.students||[]).find(x=>x.name===a.studentName&&x.kelas===a.studentClass);if(!s){toast('Data peserta didik tidak ditemukan.');return;}s.score=category;s.scoreSource='teacher';a.category=category;persistState();viewSubmission(submissionId);renderDashboard();toast('Kategori '+category+' berhasil disimpan.');}

const libraryStarterContent={
 materi:[
  {title:'Mengenal Diri dan Potensi',type:'Materi BK · Pribadi',field:'Pribadi',desc:'Panduan mengenali kekuatan, kebutuhan, nilai diri, dan hal yang ingin dikembangkan.',content:`MENGENAL DIRI DAN POTENSI

Mengenal diri berarti memahami perasaan, minat, kekuatan, nilai, serta hal yang masih ingin kita pelajari. Setiap orang memiliki keunikan dan dapat berkembang melalui latihan serta pengalaman.

Coba refleksikan pertanyaan berikut:
1. Kegiatan apa yang membuat saya bersemangat?
2. Kekuatan apa yang sering terlihat dari diri saya?
3. Tantangan apa yang sedang saya hadapi?
4. Siapa orang tepercaya yang dapat mendukung saya?
5. Satu kemampuan apa yang ingin saya latih minggu ini?

Ingat: potensi bukan sesuatu yang harus langsung sempurna. Kenali, latih, dan evaluasi secara bertahap.`},
  {title:'Mengelola Emosi dengan Sehat',type:'Materi BK · Pribadi',field:'Pribadi',desc:'Langkah sederhana mengenali emosi, memahami pemicunya, dan memilih respons yang aman.',content:`MENGELOLA EMOSI DENGAN SEHAT

Emosi adalah bagian wajar dari pengalaman manusia. Kita tidak selalu dapat memilih emosi yang muncul, tetapi kita dapat berlatih memilih cara meresponsnya.

Langkah yang bisa dicoba:
1. Berhenti sejenak dan tarik napas perlahan.
2. Beri nama emosi yang dirasakan, misalnya kecewa, takut, senang, atau cemas.
3. Kenali kejadian atau pikiran yang memicu emosi.
4. Pilih tindakan yang aman: minum air, menulis, bergerak sejenak, atau berbicara dengan orang tepercaya.
5. Evaluasi apa yang membantu dan apa yang ingin dicoba lain kali.

Jika perasaan terasa sangat berat atau mengganggu kegiatan sehari-hari, mintalah bantuan Guru BK atau orang dewasa tepercaya.`},
  {title:'Kebiasaan Belajar dan Manajemen Waktu',type:'Materi BK · Belajar',field:'Belajar',desc:'Strategi menyusun prioritas, memecah tugas, dan membangun rutinitas belajar yang realistis.',content:`KEBIASAAN BELAJAR DAN MANAJEMEN WAKTU

Kebiasaan belajar terbentuk dari langkah kecil yang dilakukan secara konsisten. Tidak harus belajar berjam-jam sekaligus; yang penting adalah tujuan jelas dan waktu yang realistis.

Strategi yang dapat dicoba:
• Catat tugas dan tenggatnya.
• Pilih satu tugas penting untuk mulai dikerjakan.
• Bagi tugas besar menjadi bagian kecil.
• Belajar dalam sesi singkat dengan jeda istirahat.
• Jauhkan gangguan yang tidak diperlukan, termasuk notifikasi gawai.
• Tinjau kembali jadwal dan sesuaikan bila terlalu berat.

Refleksi: kebiasaan apa yang paling ingin saya ubah minggu ini? Apa langkah kecil pertama yang bisa saya lakukan hari ini?`},
  {title:'Komunikasi Positif dan Pertemanan Sehat',type:'Materi BK · Sosial',field:'Sosial',desc:'Membangun komunikasi saling menghargai, batasan diri, dan cara merespons konflik.',content:`KOMUNIKASI POSITIF DAN PERTEMANAN SEHAT

Pertemanan yang sehat memberi ruang bagi setiap orang untuk merasa aman, dihargai, dan menjadi diri sendiri. Perbedaan pendapat dapat terjadi; cara kita menyikapinya yang perlu dilatih.

Praktik komunikasi positif:
1. Dengarkan tanpa memotong pembicaraan.
2. Gunakan kalimat “Saya merasa…” untuk menjelaskan pengalaman diri.
3. Sampaikan ketidaksetujuan tanpa menghina atau mengancam.
4. Hormati batasan dan privasi teman.
5. Jika konflik sulit diselesaikan, mintalah bantuan orang dewasa atau Guru BK.

Perundungan, ancaman, dan kekerasan bukan konflik biasa. Laporkan kepada orang dewasa tepercaya agar keselamatan semua pihak terjaga.`},
  {title:'Mengenali Minat dan Merancang Cita-Cita',type:'Materi BK · Karier',field:'Karier',desc:'Aktivitas awal mengenali minat, kemampuan, dan langkah menuju tujuan masa depan.',content:`MENGENALI MINAT DAN MERANCANG CITA-CITA

Eksplorasi karier dimulai dari mengenali hal yang menarik bagi diri sendiri, kegiatan yang ingin dicoba, serta kemampuan yang ingin dikembangkan. Pilihan dapat berubah seiring bertambahnya pengalaman.

1. Tuliskan tiga kegiatan yang kamu sukai.
2. Catat pelajaran atau aktivitas yang ingin kamu dalami.
3. Cari informasi dari sumber tepercaya dan orang yang berpengalaman.
4. Pilih satu keterampilan kecil untuk dilatih.
5. Evaluasi kembali minatmu setelah mencoba pengalaman baru.

Kamu tidak harus menentukan seluruh masa depan sekarang. Fokus pada langkah belajar dan eksplorasi yang bisa dilakukan saat ini.`}

function libraryCards(){const cats=[{id:'materi',title:'Materi BK',desc:'Bahan bacaan, video, dan sumber belajar menurut bidang serta topik BK.',icon:icons.book,background:'linear-gradient(135deg,#ffe1f0,#f4e7ff)'},{id:'lkpd',title:'LKPD',desc:'Lembar kerja peserta didik untuk aktivitas, refleksi, dan tindak lanjut.',icon:icons.lkpdArt||icons.file,background:'linear-gradient(135deg,#e3e8ff,#e6f5ff)'},{id:'orangtua',title:'Panduan Orang Tua',desc:'Panduan praktis komunikasi, emosi, rutinitas belajar, dan dukungan anak di rumah.',icon:icons.book,background:'linear-gradient(135deg,#dff8ed,#effbe9)'},{id:'interaktif',title:'Media Interaktif',desc:'Kartu refleksi, latihan mengenali emosi, pemecahan masalah, dan kekuatan diri.',icon:icons.mediaArt||icons.video,background:'linear-gradient(135deg,#eee2ff,#fbe6f5)'},{id:'layanan',title:'Informasi Layanan BK',desc:'Jenis layanan, cara mengakses Guru BK, privasi, dan panduan meminta bantuan.',icon:icons.folder,background:'linear-gradient(135deg,#dff0ff,#e4fff5)'},{id:'dokumen',title:'Dokumen Lainnya',desc:'Template jurnal refleksi, lembar pemantauan tujuan, dan formulir konsultasi.',icon:icons.file,background:'linear-gradient(135deg,#fff0d9,#ffe5ee)'}];const q=(window.librarySearch||'').toLowerCase();return `<div class="lesson-grid library-grid">${cats.filter(c=>(c.title+' '+c.desc).toLowerCase().includes(q)).map(c=>{const saved=c.id==='lkpd'?((state.lkpds||[]).length+(state.materials||[]).filter(m=>(m.category||'materi')===c.id).length):(state.materials||[]).filter(m=>(m.category||'materi')===c.id).length;const starter=c.id==='lkpd'?0:(libraryStarterContent[c.id]||[]).length;return `<article class="lesson-card library-resource-card"><button class="library-card-button" onclick="openLibraryFolder('${c.id}')"><div class="lesson-art" style="background:${c.background}"><div class="library-art-inner">${c.icon}</div><span class="art-spark spark-one">✦</span><span class="art-spark spark-two">✧</span></div><div class="lesson-content"><h3>${c.title}</h3><p>${c.desc}</p><div class="lesson-meta"><span>${starter+saved} sumber tersedia</span><span>Jelajahi folder ↗</span></div></div></button></article>`}).join('')||'<div class="panel">Folder tidak ditemukan. Coba kata kunci lain.</div>'}</div>`}

 const names={materi:'Materi BK',lkpd:'LKPD',orangtua:'Panduan Orang Tua',interaktif:'Media Interaktif',dokumen:'Dokumen Lainnya',layanan:'Informasi Layanan BK'};
 if(category==='lkpd'){
  const forms=(state.lkpds||[]);

  }).join('');

  return;
 }
 if(category==='materi'&&!typeFilter){

 }

}
function previewLibraryLKPD(id){const k=(state.lkpds||[]).find(x=>Number(x.id)===Number(id));if(!k)return;showModal(`<div class="form-header"><span class="pill">PRATINJAU LKPD</span><h2 style="margin-top:10px">${escapeHtml(k.title)}</h2><p>${escapeHtml(k.desc||'Petunjuk pengerjaan LKPD.')}</p></div><div class="starter-content">${(k.questions||[]).map((q,i)=>`<article class="question-card"><span class="pill">PERTANYAAN ${i+1}${q.required?' · WAJIB':''}</span><h3>${escapeHtml(q.label)}</h3><p class="muted">Jenis jawaban: ${escapeHtml(q.type)}</p>${['Pilihan ganda','Kotak centang','Dropdown'].includes(q.type)?`<ul>${(q.options||[]).map(o=>`<li>${escapeHtml(o)}</li>`).join('')}</ul>`:''}</article>`).join('')||'<p>Belum ada pertanyaan.</p>'}</div><div class="modal-actions"><button class="btn softbtn" onclick="closeModal();openLibraryFolder('lkpd')">← Kembali ke LKPD</button><button class="btn outlinebtn" onclick="editLKPD(${Number(k.id)})">Edit formulir</button></div>`)}
function openStarterResource(key){const [category,indexText]=key.split('-');const item=(libraryStarterContent[category]||[])[Number(indexText)];if(!item)return;showModal(`<div class="form-header"><span class="pill">${escapeHtml(item.type)}</span><h2 style="margin-top:10px">${escapeHtml(item.title)}</h2><p>${escapeHtml(item.desc)}</p></div><div class="starter-content">${escapeHtml(item.content).split('\n').map(line=>line?`<p>${line}</p>`:'<div class="starter-spacer"></div>').join('')}</div><div class="modal-actions"><button class="btn softbtn" onclick="closeModal();openLibraryFolder('${category}')">← Kembali ke folder</button><button class="btn primary" onclick="window.print()">Cetak / Simpan PDF</button></div>`)}
function materialIcon(type){const t=String(type||'').toLowerCase();if(t.includes('pdf'))return icons.pdfArt||icons.file;if(t.includes('power')||t.includes('ppt'))return icons.pptArt||icons.book;if(t.includes('video'))return icons.video;if(t.includes('link'))return icons.folder;return icons.file}
function renderMaterialModal_(m,fileData){
 const name=String(m.fileName||'Materi');
 const lower=name.toLowerCase();
 const isPdf=lower.endsWith('.pdf');
 const isPpt=/\.(ppt|pptx)$/i.test(lower);
 const fileHref=fileData?materialObjectUrl_(fileData):'';
 const openLabel=isPdf?'Buka PDF ↗':isPpt?'Buka PowerPoint ↗':'Buka file ↗';
 const downloadLabel=isPdf?'Unduh PDF ↓':isPpt?'Unduh PowerPoint ↓':'Unduh file ↓';
 const filePanel=fileHref?`<div class="panel"><p>File yang diunggah: <b>${escapeHtml(name)}</b></p><div class="modal-actions" style="justify-content:flex-start;flex-wrap:wrap"><a class="btn primary" href="${fileHref}" target="_blank" rel="noopener">${openLabel}</a><a class="btn outlinebtn" href="${fileHref}" download="${escapeHtml(name)}">${downloadLabel}</a></div>${isPpt?'<p class="form-note">Jika browser tidak dapat menampilkan PowerPoint langsung, pilih Unduh PowerPoint lalu buka dengan aplikasi presentasi.</p>':''}</div>`:m.url?`<div class="panel"><p>Materi dibuka melalui tautan yang disimpan.</p><div class="modal-actions" style="justify-content:flex-start;flex-wrap:wrap"><a class="btn primary" href="${escapeHtml(m.url)}" target="_blank" rel="noopener">Buka materi di tab baru ↗</a><a class="btn outlinebtn" href="${escapeHtml(m.url)}" download="${escapeHtml(name)}">Unduh materi ↓</a></div><p class="form-note">Jika tautan mengarah ke Google Drive, pastikan izin berbagi file sudah sesuai.</p></div>`:`<div class="results-empty"><strong>File materi belum dapat dimuat</strong><p>Permintaan file dari database pusat belum berhasil. Coba lagi setelah beberapa saat.</p><button class="btn outlinebtn" onclick="openMaterial(${Number(m.id)})">Coba muat file lagi</button></div>`;
 showModal(`<div class="form-header"><span class="pill">${escapeHtml(m.type||'Materi')}</span><h2 style="margin-top:10px">${escapeHtml(m.title)}</h2><p>${escapeHtml(m.desc||'')}</p><div class="answer-identity-grid"><div><small>Bidang BK</small><strong>${escapeHtml(m.field||'Umum')}</strong></div><div><small>Topik</small><strong>${escapeHtml(m.lessonTitle||'Materi umum')}</strong></div></div></div>${filePanel}<div class="modal-actions"><button class="btn softbtn" onclick="closeModal()">Tutup</button></div>`);
}

function openMaterial(id){
 const m=(state.materials||[]).find(x=>Number(x.id)===Number(id));if(!m)return;
 if(m.fileData){renderMaterialModal_(m,m.fileData);return;}
 if(m.hasFileData){
   showModal(`<div style="text-align:center;padding:24px"><h2>Menyiapkan materi</h2><p class="muted">Menghubungkan ke penyimpanan pusat. Jika file belum tersedia, pilihan coba lagi akan muncul.</p><div class="loading-spinner" aria-hidden="true"></div><div class="modal-actions" style="justify-content:center"><button class="btn softbtn" onclick="closeModal()">Tutup</button></div></div>`);
   loadCentralMaterialFile_(m.id,d=>{
     if(d&&d.fileData){m.fileName=d.fileName||m.fileName;m.hasFileData=true;renderMaterialModal_(m,d.fileData);}
     else renderMaterialModal_(m,'');
   });
   return;
 }
 renderMaterialModal_(m,'');
}
function openMaterialModal(id=null,lessonId=null,category='materi',typePreset=null){const old=id==null?null:(state.materials||[]).find(x=>Number(x.id)===Number(id));const lesson=state.lessons.find(l=>Number(l.id)===Number(lessonId||old?.lessonId));const cat=old?.category||category;showModal(`<div class="form-header"><span class="pill">PERPUSTAKAAN DIGITAL</span><h2 style="margin-top:10px">${old?'Edit Materi':'Tambah Materi'}</h2><p>Materi akan muncul di folder perpustakaan dan dapat diakses siswa sesuai tautan serta topik yang dipilih.</p></div><form id="materialForm"><div class="field"><label>Judul materi *</label><input name="title" required value="${escapeHtml(old?.title||'')}" placeholder="Contoh: Mengenal dan Mengelola Emosi"></div><div class="field"><label>Folder *</label><select name="category">${[['materi','Materi BK'],['lkpd','LKPD'],['orangtua','Panduan Orang Tua'],['interaktif','Media Interaktif'],['dokumen','Dokumen Lainnya'],['layanan','Informasi Layanan BK']].map(([v,n])=>`<option value="${v}" ${cat===v?'selected':''}>${n}</option>`).join('')}</select></div><div class="field"><label>Jenis file *</label><select name="type">${['PDF','PowerPoint','Video','Link','Word','Dokumen lainnya'].map(t=>`<option ${(old?.type||typePreset||'Link')===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label>Bidang BK</label><select name="field">${['Pribadi','Belajar','Sosial','Karier','Umum'].map(t=>`<option ${old?.field===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label>Topik pembelajaran</label><select name="lessonId"><option value="">Materi umum</option>${state.lessons.map(l=>`<option value="${l.id}" ${Number(old?.lessonId||lesson?.id)===Number(l.id)?'selected':''}>${escapeHtml(l.field)} — ${escapeHtml(l.title)}</option>`).join('')}</select></div><div class="field"><label>Tautan file / video / Google Drive</label><input name="url" type="url" value="${escapeHtml(old?.url||'')}" placeholder="https://..."></div><div class="field"><label>Atau unggah file langsung dari perangkat</label><input name="uploadFile" id="materialUploadFile" type="file" accept=".pdf,.doc,.docx,.ppt,.pptx,.jpg,.jpeg,.png,.mp4,.txt"><div class="material-upload-note">Boleh pilih tautan atau unggah file. Maksimal 1,5 MB per file agar penyimpanan browser tetap ringan.${old?.fileName?`<br>File tersimpan saat ini: <b>${escapeHtml(old.fileName)}</b>`:''}</div></div><div class="field"><label>Deskripsi</label><textarea name="desc" rows="3" placeholder="Keterangan singkat materi">${escapeHtml(old?.desc||'')}</textarea></div><div class="modal-actions"><button type="button" class="btn softbtn" onclick="closeModal()">Batal</button><button class="btn primary" type="submit">${old?'Simpan Perubahan':'Simpan Materi'}</button></div></form>`);$('#materialForm').addEventListener('submit',e=>{e.preventDefault();const form=e.target;const f=new FormData(form);const upload=form.querySelector('[name="uploadFile"]').files[0];if(upload&&upload.size>1.5*1024*1024){toast('Ukuran file maksimal 1,5 MB. Silakan gunakan tautan Google Drive untuk file lebih besar.');return;}const commitMaterial=(fileData='',fileName='')=>{const lid=f.get('lessonId');const l=state.lessons.find(x=>Number(x.id)===Number(lid));const data={id:old?.id||Date.now(),title:String(f.get('title')).trim(),category:f.get('category'),type:f.get('type'),field:f.get('field'),lessonId:lid?Number(lid):null,lessonTitle:l?.title||'Materi umum',url:String(f.get('url')||'').trim(),desc:String(f.get('desc')||'').trim()};if(fileData){data.fileData=fileData;data.fileName=fileName;const ext=(fileName.split('.').pop()||'').toLowerCase();const typeByExt={pdf:'PDF',ppt:'PowerPoint',pptx:'PowerPoint',mp4:'Video',webm:'Video',mov:'Video',doc:'Word',docx:'Word',jpg:'Dokumen lainnya',jpeg:'Dokumen lainnya',png:'Dokumen lainnya',txt:'Link'};data.type=typeByExt[ext]||data.type;}else if(old){data.fileData=old.fileData||'';data.fileName=old.fileName||'';}if(old)state.materials=state.materials.map(x=>Number(x.id)===Number(old.id)?data:x);else state.materials.push(data);persistState();closeModal();renderDashboard();toast(old?'Materi berhasil diperbarui.':'Materi berhasil ditambahkan dan tampil di perpustakaan.');};if(upload){const reader=new FileReader();reader.onload=()=>commitMaterial(String(reader.result||''),upload.name);reader.onerror=()=>toast('File gagal dibaca. Coba pilih file kembali.');reader.readAsDataURL(upload);}else commitMaterial();});}
function deleteMaterial(id){const m=state.materials.find(x=>Number(x.id)===Number(id));if(!m)return;showModal(`<h2>Hapus materi?</h2><p>Materi “${escapeHtml(m.title)}” akan dihapus dari perpustakaan.</p><div class="modal-actions"><button class="btn softbtn" onclick="closeModal()">Batal</button><button class="btn primary" onclick="state.materials=state.materials.filter(x=>Number(x.id)!==${Number(id)});persistState();closeModal();renderDashboard();toast('Materi berhasil dihapus.')">Ya, hapus</button></div>`)}

function openLessonModal(){showModal(`<h2>Tambah Pembelajaran</h2><p>Tambahkan topik baru. Nomor pembelajaran dibuat otomatis dan bisa berlanjut setelah Pembelajaran 3.</p><form id="lessonForm"><div class="field"><label>Judul pembelajaran</label><input name="title" required placeholder="Contoh: Mengelola Waktu Belajar"></div><div class="field"><label>Bidang layanan</label><select name="field"><option>Pribadi</option><option>Sosial</option><option>Belajar</option><option>Karier</option></select></div><div class="field"><label>Deskripsi singkat</label><textarea name="desc" rows="3" placeholder="Tujuan dan gambaran materi"></textarea></div><div class="modal-actions"><button type="button" class="btn softbtn" onclick="closeModal()">Batal</button><button class="btn primary" type="submit">Tambah Pembelajaran</button></div></form>`);$('#lessonForm').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);state.lessons.push({id:state.lessons.length+1,title:f.get('title').trim(),field:f.get('field'),desc:f.get('desc').trim()||'Materi layanan Bimbingan dan Konseling.',color:['linear-gradient(135deg,#e0f8ed,#e2eaff)','linear-gradient(135deg,#ffe1ef,#e4e9ff)','linear-gradient(135deg,#fff0d8,#ffe1ef)'][state.lessons.length%3],icon:['book','people','star'][state.lessons.length%3]});persistState();closeModal();renderDashboard();toast('Pembelajaran berhasil ditambahkan.');})}

function openStudentLesson(id){const l=state.lessons.find(x=>x.id===id);if(!l)return;const forms=state.lkpds.filter(k=>Number(k.lessonId)===Number(id));const mine=(state.submissions||[]).filter(a=>a.studentName===state.studentName&&Number(a.lessonId)===Number(id));showModal(`<h2>${escapeHtml(l.title)}</h2><p>${escapeHtml(l.desc)}</p><div class="panel" style="padding:14px;margin:12px 0"><b>Aktivitas pembelajaran</b><p class="muted small">Baca materi dari Guru BK, lalu kerjakan LKPD yang tersedia.</p></div><h3>LKPD terkait</h3>${forms.length?forms.map(k=>{const sub=mine.find(a=>a.lkpdId===k.id);return `<div class="activity-row"><div class="activity-dot">${icons.file}</div><div style="flex:1"><strong>${escapeHtml(k.title)}</strong><small style="display:block">${escapeHtml(k.type)} · ${k.questions.length} pertanyaan · ${sub?'Sudah dikumpulkan':'Belum dikerjakan'}</small></div><button class="btn bluebtn tinybtn" onclick="openStudentLKPD(${k.id})">${sub?'Lihat / Ubah':'Kerjakan'}</button></div>`}).join(''):'<p class="muted">Belum ada LKPD untuk pembelajaran ini. Guru BK dapat menambahkannya melalui menu Kelola LKPD.</p>'}<div class="field"><label>Refleksi pembelajaran (opsional)</label><textarea id="reflectionText" rows="3" placeholder="Apa hal penting yang kamu pelajari hari ini?">${escapeHtml((state.submissions||[]).find(a=>a.studentName===state.studentName&&a.lessonId===id&&a.kind==='reflection')?.answers?.reflection||'')}</textarea></div><div class="modal-actions"><button class="btn softbtn" onclick="closeModal()">Tutup</button><button class="btn bluebtn" onclick="saveReflection(${id})">Simpan Refleksi</button></div>`)}
function saveReflection(id){const text=$('#reflectionText').value.trim();if(!text){toast('Tulis refleksi singkat sebelum menyimpan.');return}state.submissions=state.submissions||[];const old=state.submissions.find(a=>a.studentName===state.studentName&&Number(a.lessonId)===Number(id)&&a.kind==='reflection');if(old){old.answers={reflection:text};old.updatedAt=new Date().toISOString()}else state.submissions.push({id:Date.now(),kind:'reflection',studentName:state.studentName,studentClass:state.studentClass,lessonId:Number(id),answers:{reflection:text},submittedAt:new Date().toISOString()});persistState();closeModal();renderDashboard();toast('Refleksi tersimpan dan masuk ke rekap Guru BK.')}
function retryPendingSubmission(){closeModal();persistState((saved)=>{if(saved){renderDashboard();showModal('<div style="text-align:center;padding:24px 12px"><h2>Jawaban berhasil tersimpan</h2><p>Database pusat sudah mengonfirmasi penyimpanan jawabanmu.</p><div class="modal-actions" style="justify-content:center"><button class="btn bluebtn" onclick="closeModal()">Selesai</button></div></div>');}else{showModal('<div style="text-align:center;padding:24px 12px"><h2>Jawaban belum terkonfirmasi</h2><p>Jawaban masih tersimpan di perangkat ini. Periksa koneksi internet lalu coba lagi.</p><div class="modal-actions" style="justify-content:center"><button class="btn softbtn" onclick="closeModal()">Tutup</button><button class="btn bluebtn" onclick="retryPendingSubmission()">Coba lagi</button></div></div>');}})}
function openStudentLKPD(id){const k=state.lkpds.find(x=>x.id===id);if(!k)return;const old=(state.submissions||[]).find(a=>a.kind==='lkpd'&&Number(a.lkpdId)===Number(id)&&a.studentName===state.studentName&&a.studentClass===state.studentClass);const answers=old?.answers||{};showModal(`<div class="form-header"><span class="pill">LKPD DIGITAL</span><h2 style="margin-top:10px">${escapeHtml(k.title)}</h2><p>${escapeHtml(k.desc||'Baca setiap pertanyaan dan isi sesuai pengalamanmu.')}</p></div><form id="studentLKPDForm" class="student-lkpd-form"><div class="student-question-list">${(k.questions||[]).map((q,i)=>{const val=answers[i];let control='';if(q.type==='Jawaban singkat')control=`<input name="q_${i}" value="${escapeHtml(val||'')}" ${q.required?'required':''} placeholder="Ketik jawabanmu">`;else if(q.type==='Paragraf')control=`<textarea name="q_${i}" rows="4" ${q.required?'required':''} placeholder="Tuliskan jawabanmu">${escapeHtml(val||'')}</textarea>`;else if(q.type==='Dropdown')control=`<select name="q_${i}" ${q.required?'required':''}><option value="">Pilih jawaban</option>${(q.options||[]).map(o=>`<option ${val===o?'selected':''}>${escapeHtml(o)}</option>`).join('')}</select>`;else if(q.type==='Pilihan ganda')control=(q.options||[]).map(o=>`<label class="option-row"><input type="radio" name="q_${i}" value="${escapeHtml(o)}" ${val===o?'checked':''} ${q.required?'required':''}><span>${escapeHtml(o)}</span></label>`).join('');else if(q.type==='Kotak centang')control=(q.options||[]).map(o=>`<label class="option-row"><input type="checkbox" name="q_${i}" value="${escapeHtml(o)}" ${(Array.isArray(val)&&val.includes(o))?'checked':''}><span>${escapeHtml(o)}</span></label>`).join('');return `<article class="question-card"><div class="question-top"><span class="pill">PERTANYAAN ${i+1}</span>${q.required?'<span class="small" style="color:#d64b99">Wajib diisi</span>':'<span class="small muted">Opsional</span>'}</div><h3 style="font-size:15px">${escapeHtml(q.label)}</h3><div class="field">${control}</div></article>`}).join('')}</div><div class="modal-actions"><button type="button" class="btn softbtn" onclick="closeModal()">Kembali</button><button type="submit" class="btn bluebtn">${old?'Perbarui jawaban':'Kirim jawaban'}</button></div></form>`);$('#studentLKPDForm').addEventListener('submit',e=>{e.preventDefault();const submitBtn=e.target.querySelector('button[type="submit"]');if(submitBtn?.disabled)return;if(submitBtn){submitBtn.disabled=true;submitBtn.textContent='Mengirim…';}const f=new FormData(e.target),out={};for(let i=0;i<k.questions.length;i++){const q=k.questions[i];let v=q.type==='Kotak centang'?f.getAll('q_'+i):f.get('q_'+i);if(q.required&&(!v||(Array.isArray(v)&&!v.length))){toast('Lengkapi pertanyaan wajib terlebih dahulu.');if(submitBtn){submitBtn.disabled=false;submitBtn.textContent=old?'Perbarui jawaban':'Kirim jawaban';}return}out[i]=v}state.submissions=state.submissions||[];const now=new Date().toISOString();if(old){old.answers=out;old.updatedAt=now;old.submittedAt=now}else state.submissions.push({id:Date.now(),kind:'lkpd',lkpdId:k.id,lkpdTitle:k.title,lessonId:Number(k.lessonId),studentName:state.studentName,studentClass:state.studentClass,answers:out,submittedAt:now});const student=state.students.find(s=>s.name===state.studentName&&s.kelas===state.studentClass);if(student){student.status='Selesai';student.lesson=k.title;student.lastActivity=now;student.score=student.score||''}persistState((saved)=>{closeModal();if(!saved){showModal(`<div style="text-align:center;padding:24px 12px"><h2>Jawaban belum terkonfirmasi</h2><p>Jawaban masih ada di perangkat ini, tetapi database pusat belum mengonfirmasi penyimpanannya. Periksa koneksi internet lalu coba kirim kembali.</p><div class="modal-actions" style="justify-content:center"><button class="btn softbtn" onclick="closeModal()">Tutup</button><button class="btn bluebtn" onclick="retryPendingSubmission()">Coba lagi</button></div></div>`);return;}renderDashboard();showModal(`<div class="submission-success" style="text-align:center;padding:24px 12px"><div style="width:76px;height:76px;margin:0 auto 18px;border-radius:24px;background:linear-gradient(135deg,#dff8ef,#e5eaff);display:grid;place-items:center;color:#159b7b;font-size:38px;box-shadow:0 10px 28px #7c70b51c">✓</div><span class="pill" style="background:#e0f8ee;color:#148263">JAWABAN BERHASIL TERKIRIM</span><h2 style="margin:14px 0 8px">Terima kasih, ${escapeHtml(state.studentName)}!</h2><p>Jawaban LKPD <b>${escapeHtml(k.title)}</b> sudah berhasil dikirim dan tercatat di ruang Guru BK.</p><p class="muted">Kamu sudah menyelesaikan satu langkah belajar hari ini. Terus bertumbuh, satu langkah kecil setiap kali.</p><div class="modal-actions" style="justify-content:center;margin-top:22px"><button class="btn bluebtn" onclick="closeModal();openLibraryFolder('lkpd')">Kembali ke daftar LKPD</button><button class="btn outlinebtn" onclick="closeModal()">Selesai</button></div></div>`);});})}
function openStudentModal(){showModal(`<h2>Tambah Peserta Didik</h2><p>Lengkapi data peserta didik yang ingin ditambahkan.</p><form id="newStudentForm"><div class="field"><label>Nama lengkap</label><input name="name" required></div><div class="field"><label>Kelas</label><select name="kelas">${['VII','VIII','IX'].flatMap(t=>'ABCDEFGHIJK'.split('').map(c=>t+' '+c)).map(c=>`<option>${c}</option>`).join('')}</select></div><div class="field"><label>Jenis kelamin</label><select name="gender" required><option value="">Pilih jenis kelamin</option><option value="Laki-laki">Laki-laki</option><option value="Perempuan">Perempuan</option></select><small class="muted">Data ini digunakan untuk menyesuaikan ilustrasi profil siswa.</small></div><div class="modal-actions"><button type="button" class="btn softbtn" onclick="closeModal()">Batal</button><button class="btn primary">Simpan</button></div></form>`);$('#newStudentForm').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);const name=f.get('name').trim();if(state.students.some(s=>s.name.toLowerCase()===name.toLowerCase()&&s.kelas===f.get('kelas'))){toast('Nama dan kelas tersebut sudah terdaftar.');return}state.students.push({name,kelas:f.get('kelas'),gender:f.get('gender')||'Laki-laki',lesson:'Belum ada aktivitas',status:'Aktif',score:''});persistState();closeModal();renderDashboard();toast('Data peserta didik berhasil ditambahkan. Siswa dapat login dengan kode akses 1234.')})}
function viewStudent(name){const s=state.students.find(x=>x.name===name);if(!s)return;showModal(`<h2>Detail Peserta Didik</h2><p>Data pribadi yang tersimpan di SI-PENA BK.</p><div class="field"><label>Nama peserta didik</label><input value="${escapeHtml(s.name)}" readonly></div><div class="field"><label>Kelas / rombel</label><input value="${escapeHtml(s.kelas)}" readonly></div><div class="field"><label>Jenis kelamin</label><input value="${escapeHtml(s.gender||'Belum diisi')}" readonly></div><div class="field"><label>Status</label><input value="${escapeHtml(s.status||'Aktif')}" readonly></div><div class="modal-actions"><button class="btn softbtn" onclick="closeModal()">Tutup</button></div>`)}
function deleteStudent(name){const s=state.students.find(x=>x.name===name);if(!s)return;showModal(`<h2>Hapus Data Peserta Didik?</h2><p>Data <b>${escapeHtml(s.name)}</b> kelas ${escapeHtml(s.kelas)} akan dihapus bersama seluruh jawaban LKPD dan aktivitas yang terkait. Siswa tidak akan dapat login lagi setelah perubahan tersimpan di database pusat.</p><div class="modal-actions"><button class="btn softbtn" onclick="closeModal()">Batal</button><button class="btn primary" onclick="confirmDeleteStudent('${escapeJs(s.name)}','${escapeJs(s.kelas)}')">Hapus Data</button></div>`)}
function confirmDeleteStudent(name,kelas){
 const norm=v=>String(v||'').trim().toLowerCase();
 const targetName=norm(name),targetClass=norm(kelas);
 const belongsToStudent=x=>{const n=norm(x.studentName||x.name),c=norm(x.studentClass||x.kelas);return n===targetName&&(!c||c===targetClass)};
 state.students=(state.students||[]).filter(x=>!(norm(x.name)===targetName&&norm(x.kelas)===targetClass));
 state.submissions=(state.submissions||[]).filter(x=>!belongsToStudent(x));
 state.activities=(state.activities||[]).filter(x=>!belongsToStudent(x));
 persistState();closeModal();renderDashboard();
 toast('Data siswa, seluruh jawaban LKPD, dan aktivitas terkait berhasil dihapus.');
}

function showModal(content){$('#modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><section class="modal">${content}</section></div>`}
function closeModal(){$('#modalRoot').innerHTML=''}
function initials(name){return name.split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function escapeJs(v){return String(v??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'")}

function stat(label,value,icon,bg,fg,caption){return `<article class="stat"><div class="stat-top"><span>${escapeHtml(label)}</span><span class="stat-icon" style="background:${bg};color:${fg}">${icon||''}</span></div><strong>${escapeHtml(value)}</strong><span>${escapeHtml(caption||'')}</span></article>`}
function mappingPanel(){
 const colors={A:'#9b7bed',B:'#6ba4f7',C:'#f078a6'},total=state.students.filter(s=>['A','B','C'].includes(String(s.score))).length;
 const counts={A:state.students.filter(s=>String(s.score)==='A').length,B:state.students.filter(s=>String(s.score)==='B').length,C:state.students.filter(s=>String(s.score)==='C').length};
 const pct=k=>total?Math.round(counts[k]/total*100):0;const a=pct('A'),b=pct('B'),c=Math.max(0,100-a-b);
 return `<div class="mapping-visual"><button class="donut-chart" aria-label="Pemetaan kategori A B C" style="background:conic-gradient(${colors.A} 0 ${a}%,${colors.B} ${a}% ${a+b}%,${colors.C} ${a+b}% 100%)" onclick="showCategory('A')"><span><strong>${total}</strong><small>Hasil<br>penilaian</small></span></button><div class="mapping-legend">${[['A','Berkembang baik'],['B','Sedang berkembang'],['C','Perlu pendampingan']].map(([k,label])=>`<button class="mapping-legend-row" onclick="showCategory('${k}')"><span class="legend-dot" style="background:${colors[k]}"></span><span>${k} (${label})</span><strong>${pct(k)}%</strong><small>${counts[k]} siswa</small></button>`).join('')}</div></div><p class="form-note mapping-note">Hanya hasil yang sudah diberi kategori yang dihitung. Siswa yang belum dinilai tidak otomatis masuk kategori A, B, atau C.</p>`;
}
function fieldRecapPanel(){
 const fields=['Pribadi','Belajar','Sosial','Karier'];const colors={A:'#a78bfa',B:'#75aaf7',C:'#f47ca7'};
 return `<div class="field-chart">${fields.map(f=>{const lessons=state.lessons.filter(l=>l.field===f);const counts={A:0,B:0,C:0};state.students.forEach(s=>{if(['A','B','C'].includes(String(s.score))&&lessons.some(l=>String(l.id)===String(s.lessonId)||l.title===s.lesson))counts[s.score]++});const max=Math.max(1,...Object.values(counts));return `<div class="field-chart-row"><div class="field-chart-title"><strong>${f}</strong><span>${lessons.length} topik</span></div><div class="field-bars">${['A','B','C'].map(k=>`<div class="field-bar-wrap"><span>${counts[k]}</span><div class="field-bar" style="height:${Math.max(4,counts[k]/max*64)}px;background:${colors[k]}"></div><small>${k}</small></div>`).join('')}</div></div>`}).join('')}</div><div class="field-legend"><span><i style="background:${colors.A}"></i>A · Berkembang baik</span><span><i style="background:${colors.B}"></i>B · Sedang berkembang</span><span><i style="background:${colors.C}"></i>C · Perlu pendampingan</span></div><p class="form-note">Rekap dihitung dari kategori peserta didik yang sudah ditetapkan dan dikaitkan dengan bidang pembelajarannya.</p>`;
}
function showCategory(k){const a=state.students.filter(s=>String(s.score)===k);showModal(`<h2>Pemetaan Perkembangan — Kategori ${k}</h2><p>${a.length} peserta didik pada kategori ${k} ().</p>${a.map(s=>`<div class="activity-row"><div class="mini-avatar">${initials(s.name)}</div><div style="flex:1"><strong>${escapeHtml(s.name)}</strong><small style="display:block">${s.kelas} · ${s.lesson}</small></div><button class="btn primary tinybtn" onclick="closeModal();downloadStudentPDF('${escapeJs(s.name)}')">PDF</button></div>`).join('')||'<p>Belum ada siswa pada kategori ini.</p>'}<div class="modal-actions"><button class="btn softbtn" onclick="closeModal()">Tutup</button></div>`)}
function lkpdPage(){return `<div class="section-head" style="margin-top:0"><div><h2>Kelola LKPD</h2><p>Tambahkan, edit, atau hapus lembar kerja dan kaitkan dengan pembelajaran.</p></div><button class="btn primary" onclick="openLKPDModal()">＋ Tambah LKPD</button></div><div class="lesson-grid">${state.lkpds.map(k=>`<article class="lesson-card"><div class="lesson-art" style="background:linear-gradient(135deg,#ffe1f0,#e4e9ff)">${icons.file||icons.folderSmall}</div><div class="lesson-content"><span class="pill">${escapeHtml(k.type)}</span><h3>${escapeHtml(k.title)}</h3><p>Pembelajaran ${k.lessonId} · ${escapeHtml(k.desc)}</p><div style="display:flex;gap:7px"><button class="btn outlinebtn tinybtn" style="flex:1" onclick="editLKPD(${k.id})">Edit</button><button class="btn softbtn tinybtn" onclick="deleteLKPD(${k.id})">Hapus</button></div></div></article>`).join('')}</div><p class="form-note">LKPD yang disimpan di sini akan muncul pada portal siswa sesuai pembelajaran yang dipilih.</p>`}
function openLKPDModal(old){
 const k=old||{title:'',lessonId:state.lessons[0]?.id||1,type:'Refleksi',desc:'',questions:[]};
 window.lkpdQuestions=(k.questions||[]).map(q=>({...q,options:[...(q.options||[])]}));
 const choiceTypes=['Pilihan ganda','Kotak centang','Dropdown'];
 const esc=escapeHtml;
 window.lkpdRenderQuestions=()=>{
  const qs=window.lkpdQuestions;
  if(!qs.length)return '<div class="form-header"><b>Belum ada pertanyaan</b><p>Tambahkan pertanyaan dan tentukan jenis jawaban yang ingin digunakan.</p></div>';
  return qs.map((q,i)=>{
   const isChoice=choiceTypes.includes(q.type);
   const symbol=q.type==='Pilihan ganda'?'radio':q.type==='Kotak centang'?'check':'';
   const options=isChoice?(q.options||[]).map((op,j)=>`<div class="option-row"><span class="option-symbol ${symbol}"></span><input type="text" value="${esc(op)}" aria-label="Pilihan ${j+1}" placeholder="Pilihan ${j+1}" oninput="window.lkpdQuestions[${i}].options[${j}]=this.value"><button type="button" class="btn softbtn tinybtn" aria-label="Hapus pilihan" onclick="window.lkpdQuestions[${i}].options.splice(${j},1);document.getElementById('questionEditor').innerHTML=window.lkpdRenderQuestions()">Hapus</button></div>`).join(''):'';
   let preview=q.type==='Jawaban singkat'?'<input disabled placeholder="Jawaban singkat" style="width:min(100%,360px);border:0;border-bottom:1px solid #dfe4f1;padding:10px 2px">':q.type==='Paragraf'?'<textarea disabled rows="2" placeholder="Jawaban panjang" style="width:100%;max-width:460px;border:0;border-bottom:1px solid #dfe4f1;padding:10px 2px"></textarea>':q.type==='Dropdown'?`<select disabled style="width:min(100%,360px);padding:11px;border:1px solid #dfe4f1;border-radius:9px"><option>Pilih jawaban</option>${(q.options||[]).map(o=>`<option>${esc(o)}</option>`).join('')}</select>`:isChoice?options:'';
   return `<article class="question-card"><div class="question-top"><span class="pill">PERTANYAAN ${i+1}</span><button type="button" class="btn softbtn tinybtn" onclick="window.lkpdQuestions.splice(${i},1);document.getElementById('questionEditor').innerHTML=window.lkpdRenderQuestions()">Hapus pertanyaan</button></div><div class="field"><label>Teks pertanyaan</label><input type="text" value="${esc(q.label||'')}" oninput="window.lkpdQuestions[${i}].label=this.value" placeholder="Tulis pertanyaan di sini" required></div><div class="field"><label>Jenis jawaban</label><select onchange="window.lkpdChangeType(${i},this.value)">${['Jawaban singkat','Paragraf','Pilihan ganda','Kotak centang','Dropdown'].map(t=>`<option value="${t}" ${q.type===t?'selected':''}>${t}</option>`).join('')}</select></div>${isChoice?`<div class="builder-subtitle">Pilihan jawaban — klik teks untuk mengubahnya</div>${options}<button type="button" class="add-option" onclick="window.lkpdQuestions[${i}].options.push('Pilihan baru');document.getElementById('questionEditor').innerHTML=window.lkpdRenderQuestions()">＋ Tambahkan pilihan</button>`:`<div class="builder-subtitle">Pratinjau jawaban</div>${preview}`}<div class="question-tools"><label><input type="checkbox" ${q.required?'checked':''} onchange="window.lkpdQuestions[${i}].required=this.checked"> Wajib diisi</label><span class="builder-subtitle">${q.required?'Peserta didik harus menjawab pertanyaan ini':'Pertanyaan opsional'}</span></div></article>`;
  }).join('');
 };
 window.lkpdChangeType=(i,type)=>{const q=window.lkpdQuestions[i];q.type=type;if(choiceTypes.includes(type)&&!q.options?.length)q.options=['Pilihan 1','Pilihan 2'];if(!choiceTypes.includes(type))q.options=[];document.getElementById('questionEditor').innerHTML=window.lkpdRenderQuestions()};
 showModal(`<div class="form-header"><span class="pill">PEMBUAT FORMULIR LKPD</span><h2 style="margin-top:12px">${old?'Edit LKPD':'Buat LKPD baru'}</h2><p>Susun lembar kerja digital dengan jenis pertanyaan dan pilihan jawaban yang dapat diubah seperti Google Formulir.</p></div><form id="lkpdForm"><div class="form-header"><div class="field"><label>Judul formulir *</label><input name="title" required value="${esc(k.title)}" placeholder="Contoh: Refleksi Mengenal Diri"></div><div class="field"><label>Deskripsi / petunjuk</label><textarea name="desc" rows="3" placeholder="Petunjuk pengerjaan untuk peserta didik">${esc(k.desc)}</textarea></div><div class="field"><label>Pembelajaran terkait</label><select name="lessonId">${state.lessons.map(l=>`<option value="${l.id}" ${Number(k.lessonId)===l.id?'selected':''}>${esc(l.field)} — ${esc(l.title)}</option>`).join('')}</select></div><div class="field"><label>Kategori LKPD</label><select name="type">${['Refleksi','Latihan','Diskusi','Asesmen diri','Rencana aksi','Evaluasi','Kuis'].map(t=>`<option ${k.type===t?'selected':''}>${t}</option>`).join('')}</select></div></div><div id="questionEditor">${window.lkpdRenderQuestions()}</div><button type="button" class="builder-add" id="addQuestion">＋ Tambahkan pertanyaan</button><div class="modal-actions"><button type="button" class="btn softbtn" onclick="closeModal()">Batal</button><button class="btn primary" type="submit">${old?'Simpan perubahan':'Simpan formulir'}</button></div></form>`);
 $('#addQuestion').addEventListener('click',()=>{window.lkpdQuestions.push({label:'',type:'Pilihan ganda',required:true,options:['Pilihan 1','Pilihan 2']});$('#questionEditor').innerHTML=window.lkpdRenderQuestions();const cards=$$('#questionEditor .question-card');cards[cards.length-1]?.scrollIntoView({behavior:'smooth',block:'nearest'})});
 $('#lkpdForm').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);const qs=window.lkpdQuestions.map(q=>({...q,label:(q.label||'').trim(),options:(q.options||[]).map(o=>o.trim()).filter(Boolean)}));if(qs.some(q=>!q.label)){toast('Lengkapi teks semua pertanyaan terlebih dahulu.');return}if(qs.some(q=>choiceTypes.includes(q.type)&&q.options.length<2)){toast('Setiap pertanyaan pilihan harus memiliki minimal dua pilihan jawaban.');return}const data={id:old?old.id:Math.max(0,...state.lkpds.map(x=>x.id))+1,title:f.get('title').trim(),lessonId:Number(f.get('lessonId')),type:f.get('type'),desc:f.get('desc').trim(),questions:qs};if(old)state.lkpds=state.lkpds.map(x=>x.id===old.id?data:x);else state.lkpds.push(data);persistState();closeModal();renderDashboard();toast(old?'Formulir LKPD berhasil diperbarui.':'Formulir LKPD berhasil dibuat.')});
}
