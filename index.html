/* Dashboard di HP memakai tata letak laptop/tab (menu di samping), otomatis diskalakan ke layar.
   Ubah DESIGN_WIDTH: makin besar = makin kecil di layar HP (tetap bisa di-zoom). */
(function(){
var DESIGN_WIDTH=1024,m=document.querySelector('meta[name=viewport]'),last='',t=0;
function phone(){return Math.min(screen.width,screen.height)<700}
function apply(){
 t=0;if(!m)return;
 var dash=!!document.querySelector('.app-layout');
 var c=(phone()&&dash)?'width='+DESIGN_WIDTH+', viewport-fit=cover':'width=device-width, initial-scale=1';
 if(c!==last){last=c;m.setAttribute('content',c)}
}
function sched(){if(!t)t=requestAnimationFrame(apply)}
apply();
document.addEventListener('DOMContentLoaded',function(){
 apply();new MutationObserver(sched).observe(document.body,{childList:true,subtree:true});
});
window.addEventListener('orientationchange',function(){setTimeout(apply,300)});
})();
</script>

/* Ilustrasi fitur utama: adegan SVG yang lebih kaya dengan gerak lembut. */
#fitur .feature{padding:0 0 20px;overflow:hidden;background:linear-gradient(150deg,#fff 0%,#fffafd 100%);}
#fitur .feature-illustration{height:142px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;margin:0 0 17px;border-radius:18px 18px 0 0;isolation:isolate;}
#fitur .feature-illustration:before,#fitur .feature-illustration:after{content:"";position:absolute;border-radius:50%;pointer-events:none;z-index:-1;animation:featureBlob 7s ease-in-out infinite;}
#fitur .feature-illustration:before{width:118px;height:118px;left:-25px;top:-43px;background:#ffffff8c;}
#fitur .feature-illustration:after{width:94px;height:94px;right:-20px;bottom:-48px;background:#ffffffa6;animation-delay:-3.5s;}
#fitur .feature-illustration svg{height:136px;width:min(100%,230px);overflow:visible;filter:drop-shadow(0 5px 3px #8a78ad12);animation:featureSceneFloat 5s ease-in-out infinite;}
#fitur .feature h3,#fitur .feature p,#fitur .feature .feature-detail{margin-left:20px;margin-right:20px;}
#fitur .feature h3{font-size:15px;margin-bottom:8px;}
#fitur .feature p{font-size:12px;line-height:1.7;min-height:61px;}
#fitur .feature .feature-detail{display:inline-flex;align-items:center;gap:7px;margin-top:12px;font-size:10px;padding:7px 11px;border-radius:999px;background:#f4efff;color:#7954b1;font-weight:700;}
#fitur .feature .feature-detail:after{content:"➜";font-size:13px;transition:transform .2s ease;}
#fitur .feature:hover .feature-detail:after{transform:translateX(3px);}
.art-personal{background:linear-gradient(120deg,#ffe2f0,#f2e8ff)}.art-social{background:linear-gradient(120deg,#e4f2ff,#e8e9ff)}.art-learning{background:linear-gradient(120deg,#eee6ff,#fce7f5)}.art-career{background:linear-gradient(120deg,#fff0d5,#ffe5ed)}.art-library{background:linear-gradient(120deg,#ddf8ef,#e8f5ff)}.art-progress{background:linear-gradient(120deg,#e6edff,#ffe7f4)}
#fitur .art-spark{position:absolute;z-index:2;font-size:22px;color:#a184e5;animation:featureTwinkle 3.4s ease-in-out infinite;}
#fitur .spark-one{top:22px;left:20%;}#fitur .spark-two{right:16%;bottom:20px;animation-delay:-1.7s;}
#fitur .art-float-left{transform-origin:center;animation:featureCharacter 4s ease-in-out infinite;}#fitur .art-float-right{transform-origin:center;animation:featureCharacter 4.5s ease-in-out infinite reverse;}
@keyframes featureSceneFloat{0%,100%{transform:translateY(2px)}50%{transform:translateY(-5px)}}
@keyframes featureBlob{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(9px,-5px) scale(1.08)}}
@keyframes featureTwinkle{0%,100%{opacity:.45;transform:scale(.8) rotate(-8deg)}50%{opacity:1;transform:scale(1.15) rotate(12deg)}}
@keyframes featureCharacter{0%,100%{translate:0 0}50%{translate:0 -3px}}

{id:1,title:'Mengenal Diri, Mengelola Emosi',desc:'Mengenali kekuatan diri, memahami emosi, dan membangun kebiasaan regulasi emosi.',field:'Pribadi',materi:1,lkpd:1,color:'linear-gradient(135deg,#ffe1ef,#e4e9ff)',icon:'person'},
{id:2,title:'Strategi Belajar Efektif',desc:'Mengembangkan fokus, motivasi, dan kebiasaan belajar yang teratur.',field:'Belajar',materi:2,lkpd:1,color:'linear-gradient(135deg,#dff3ff,#e9e0ff)',icon:'book'},
{id:3,title:'Komunikasi Positif dalam Pergaulan',desc:'Berlatih komunikasi asertif, empati, dan membangun pertemanan yang sehat.',field:'Sosial',materi:2,lkpd:1,color:'linear-gradient(135deg,#e7e0ff,#ffe4f1)',icon:'people'},
{id:4,title:'Jelajahi Minat dan Cita-Cita',desc:'Mengeksplorasi minat, potensi, dan langkah kecil untuk masa depan.',field:'Karier',materi:1,lkpd:1,color:'linear-gradient(135deg,#fff0d8,#ffe1ef)',icon:'star'}],

function applyAppData(d){if(!d)return;['students','lessons','lkpds','submissions','activities','materials'].forEach(k=>{if(Array.isArray(d[k]))state[k]=d[k]});if(Array.isArray(state.materials)){const seen=new Set();state.materials=state.materials.filter(m=>{const key=String(m.id??'');if(key&&seen.has(key))return false;if(key)seen.add(key);return true;}).map(m=>{const ext=String(m.fileName||'').split('.').pop().toLowerCase();const typeByExt={pdf:'PDF',ppt:'PowerPoint',pptx:'PowerPoint',mp4:'Video',doc:'Word',docx:'Word',jpg:'Dokumen lainnya',jpeg:'Dokumen lainnya',png:'Dokumen lainnya',txt:'Link'};if(m.fileName&&typeByExt[ext])m.type=typeByExt[ext];return m;});}if(d.teacherName)state.teacherName=d.teacherName;}

function setDirtyFlag_(v){try{if(v)localStorage.setItem('sipena_bk_dirty',dirtyRole_);else localStorage.removeItem('sipena_bk_dirty');}catch(e){}}
function stableJson_(value){

/* ---- komunikasi dengan Apps Script (fetch biasa, tanpa JSONP) ---- */
async function apiGet_(action){
 const r=await fetch(CENTRAL_API_URL+'?action='+action+'&_='+Date.now()+Math.random().toString(36).slice(2),{redirect:'follow',cache:'no-store'});
 return await r.json();
}
async function apiPost_(payload){
 const r=await fetch(CENTRAL_API_URL,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});

}

 if(Array.isArray(d.deletedSubmissionIds))state.deletedSubmissionIds=d.deletedSubmissionIds;

/* ---- simpan: antrian + coba ulang otomatis sampai berhasil ---- */
function persistState(onComplete){
 const snapshot=appData();
 snapshot.clientSaveId='sipena-'+Date.now()+'-'+Math.random().toString(36).slice(2);
 cacheLocalState(snapshot);

 localDirty=true;setDirtyFlag_(true);
 if(onComplete)saveCallbacks_.push(onComplete);

async function flushSave_(){

 try{res=await apiPost_({action:'save',onlySubmissions:dirtyRole_==='student',data:snapshot});}
 catch(e){console.warn('Simpan ke pusat gagal',e);}

 if(ok){
   lastCentralUpdatedAt=res.updatedAt||lastCentralUpdatedAt;
   if(sameSavedState_(snapshot,appData())&&!saveAgain){
     localDirty=false;setDirtyFlag_(false);dirtyRole_='teacher';
     if(Array.isArray(res.submissions)&&stableJson_(res.submissions)!==stableJson_(state.submissions||[])){state.submissions=res.submissions;refreshUI_();}

/* ---- unggah file ke Google Drive (potongan 1,5 MB) ---- */
function blobToB64_(blob){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result||'').split(',')[1]||'');r.onerror=()=>no(new Error('File tidak terbaca'));r.readAsDataURL(blob);});}
const sleep_=ms=>new Promise(r=>setTimeout(r,ms));
async function uploadFileToDrive_(file,onProgress){
 const CH=1500000;const total=Math.max(1,Math.ceil(file.size/CH));
 const uploadId='up'+Date.now()+Math.random().toString(36).slice(2,8);
 let last=null;
 for(let i=0;i<total;i++){
   const b64=await blobToB64_(file.slice(i*CH,(i+1)*CH));
   let res=null;
   for(let a=0;a<3&&!(res&&res.ok);a++){
     try{res=await apiPost_({action:'uploadChunk',uploadId,index:i,total,name:file.name,mime:file.type||'application/octet-stream',b64});}
     catch(e){res=null;await sleep_(900);}
   }
   if(!res||!res.ok)throw new Error((res&&res.error)||'koneksi ke Google Drive gagal');
   if(onProgress)onProgress(Math.round((i+1)/total*100));
   last=res;

}
function deleteMaterialFile_(id){const m=(state.materials||[]).find(x=>Number(x.id)===Number(id));if(m&&m.driveId)apiPost_({action:'deleteFile',driveId:m.driveId}).catch(()=>{});}

function driveDownloadUrl_(id){return 'https://drive.google.com/uc?export=download&id='+encodeURIComponent(id);}

function materialObjectUrl_(dataUri){
 try{
   const match=String(dataUri||'').match(/^data:([^;,]+)?(;base64)?,([\s\S]*)$/);
   if(!match)return dataUri;
   const mime=match[1]||'application/octet-stream';
   const payload=match[3]||'';
   let blob;
   if(match[2]){
     const binary=atob(payload);const bytes=new Uint8Array(binary.length);
     for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
     blob=new Blob([bytes],{type:mime});
   }else blob=new Blob([decodeURIComponent(payload)],{type:mime});
   return URL.createObjectURL(blob);
 }catch(e){console.warn('Tidak dapat membuat tautan file lokal',e);return dataUri;}
}
function syncCentralIfChanged(){

   if(!meta||!meta.updatedAt||meta.updatedAt===lastCentralUpdatedAt||localDirty||savingNow)return;

function mergeInitialData(central,local){
 const result={};const keys=['students','lessons','lkpds','materials','submissions','activities'];
 const keyFor=(kind,x)=>{
   if(kind==='students')return String(x.name||x.studentName||'').trim().toLowerCase()+'|'+String(x.kelas||x.studentClass||'').trim().toLowerCase();
   if(kind==='submissions')return String(x.id||'')||[x.kind,x.studentName,x.studentClass,x.lkpdId,x.lessonId,x.submittedAt].join('|');
   // LKPD/materi yang dibuat di perangkat berbeda bisa memakai nomor ID lokal yang sama.

   if(kind==='materials')return [String(x.title||'').trim().toLowerCase(),String(x.category||'materi'),String(x.url||''),String(x.fileName||'')].join('|');

   const l=Array.isArray(local&&local[k])?local[k]:[];
   const out=c.map(x=>({...x}));const seen=new Set(out.map(x=>keyFor(k,x)));
   l.forEach(x=>{const key=keyFor(k,x);if(!seen.has(key)){out.push({...x});seen.add(key)}});
   // Jaga ID tetap unik jika dua perangkat membuat item baru dengan nomor lokal sama.
   if(k==='lkpds'||k==='materials'){
     const ids=new Set();let next=Math.max(0,...out.map(x=>Number(x.id)||0));
     out.forEach(x=>{const id=String(x.id??'');if(!id||ids.has(id)){next+=1;x.id=next;}ids.add(String(x.id));});
   }
   result[k]=out;
 });
 result.teacherName=(central&&central.teacherName)||(local&&local.teacherName)||state.teacherName||'Putri Vara Diba';
 result.schemaVersion=3;
 return result;
}
function startApp(){
 let local=null;
 try{local=JSON.parse(localStorage.getItem('sipena_bk_state_v1')||'null')}catch(e){}
 if(local){applyAppData(local);if(Array.isArray(local.deletedSubmissionIds))state.deletedSubmissionIds=local.deletedSubmissionIds;}
 state.lkpds=(state.lkpds||[]).filter(k=>!['Refleksi Mengenal Diri','Latihan Komunikasi Asertif'].includes(k.title));
 if(!Array.isArray(state.students))state.students=[];
 try{const f=localStorage.getItem('sipena_bk_dirty');if(f){localDirty=true;dirtyRole_=f==='student'?'student':'teacher';}}catch(e){}
 home();   // tampil langsung dari cache perangkat — tanpa layar loading
 if(!centralApiReady()){firstSyncDone=true;return;}
 initialSync_(0);
 startCentralPolling();
}
function initialSync_(attempt){
 setSyncBadge_('sync');
 loadCentralState(d=>{
   if(!d){setSyncBadge_('error');setTimeout(()=>initialSync_(attempt+1),Math.min(1200*(attempt+1),8000));return;}
   firstSyncDone=true;
   lastCentralUpdatedAt=d.updatedAt||'';
   if(localDirty){            // ada perubahan lokal yang belum terkirim: kirim dulu
     setSyncBadge_('saving');flushSave_();return;
   }
   if(!centralStateHasData(d)){   // database pusat masih kosong: isi dengan data awal aplikasi
     persistState();return;
   }
   applyRemote_(d);cacheLocalState(appData());setSyncBadge_('ok');refreshUI_();
 });
}

</svg></div><div class="about-copy"><span class="landing-kicker">TENTANG SI-PENA BK</span><h2>Teknologi yang mendukung layanan BK yang lebih dekat dengan peserta didik</h2><p>SI-PENA BK (Sistem Informasi Pelayanan Bimbingan dan Konseling) merupakan ruang digital pendukung pelaksanaan layanan Bimbingan dan Konseling di sekolah. Platform ini dirancang untuk menghubungkan pengelolaan layanan oleh Guru BK dengan kegiatan belajar peserta didik, penyediaan materi, pengisian LKPD, refleksi, serta pemantauan aktivitas. Dengan alur yang teratur, informasi layanan diharapkan lebih mudah ditemukan dan dokumentasi kegiatan lebih tertata.</p><p>Platform ini berfungsi sebagai alat bantu, bukan pengganti hubungan pendampingan antara Guru BK dan peserta didik. Data serta hasil aktivitas tetap perlu ditinjau secara bijaksana, dengan memperhatikan konteks, kerahasiaan informasi, dan kebutuhan masing-masing peserta didik. Dengan demikian, teknologi dapat mendukung layanan yang lebih terorganisasi sekaligus tetap mengutamakan hubungan yang aman, hangat, dan berpusat pada peserta didik.</p><div class="about-points"><span>✓ Berpusat pada peserta didik</span><span>✓ Mendukung empat bidang BK</span><span>✓ Mendorong refleksi dan tindak lanjut</span></div></div></section>
<section id="faq" class="landing-faq-section"><div class="landing-section-title"><div><span class="landing-kicker">PERTANYAAN UMUM</span><h2>Hal yang Sering Ditanyakan</h2></div></div>
<div class="faq-list">
<details><summary>Siapa saja yang dapat menggunakan SI-PENA BK?</summary><p>SI-PENA BK memiliki dua portal yang saling terhubung. Portal Guru BK dipakai untuk mengelola data peserta didik, menyusun pembelajaran pada bidang pribadi, belajar, sosial, dan karier, menyiapkan materi dan LKPD, memeriksa jawaban, menetapkan kategori A/B/C, serta mengunduh laporan. Portal Peserta Didik dipakai siswa untuk membaca materi, mengerjakan LKPD, mengirim jawaban, dan melihat riwayat serta perkembangan dirinya sendiri.</p></details>
<details><summary>Bagaimana peserta didik dapat masuk?</summary><p>Guru BK terlebih dahulu mendaftarkan peserta didik pada menu Data Peserta Didik. Setelah itu siswa membuka Portal Peserta Didik, lalu mengisi nama, kelas, dan kode akses yang diberikan Guru BK. Nama dan kelas harus sama persis dengan data yang didaftarkan. Jika siswa belum bisa masuk, periksa kembali penulisan nama, kelas, dan kode aksesnya, atau hubungi Guru BK.</p></details>
<details><summary>Apakah data dapat dibuka dari perangkat lain?</summary><p>Ya. Data disimpan di penyimpanan pusat, bukan di satu perangkat saja, sehingga dapat dibuka dari peramban di HP, tablet, maupun laptop dengan akun yang sama. Materi yang diunggah disimpan di Google Drive. Ketika Guru BK memperbarui data atau siswa mengirim jawaban, perubahan akan tampil di perangkat lain setelah data dimuat ulang secara otomatis, dan koneksi internet diperlukan agar data tetap sinkron.</p></details>
<details><summary>Apakah kategori A/B/C menjadi nilai akhir peserta didik?</summary><p>Tidak. Kategori A (berkembang baik), B (sedang berkembang), dan C (perlu pendampingan) adalah pemetaan perkembangan yang ditetapkan Guru BK berdasarkan jawaban LKPD dan pengamatan layanan. Kategori ini dipakai sebagai bahan refleksi dan perencanaan tindak lanjut, bukan sebagai nilai rapor, peringkat, atau satu-satunya dasar untuk menilai peserta didik.</p></details>
<details><summary>Bagaimana dengan kerahasiaan data peserta didik?</summary><p>Data peserta didik dan hasil aktivitasnya hanya ditinjau oleh Guru BK melalui akunnya, sedangkan siswa hanya dapat melihat riwayat dan laporan miliknya sendiri. Guru BK tetap perlu menjaga kerahasiaan informasi, tidak membagikan hasil kepada pihak yang tidak berkepentingan, dan menggunakan laporan secara bijaksana. SI-PENA BK berfungsi sebagai alat bantu layanan, bukan pengganti hubungan pendampingan yang hangat dan saling percaya.</p></details>
</div></section>
<section class="landing-bottom-callout"><div><strong>Setiap langkah kecil adalah bagian dari perkembangan.</strong><p>Setiap peserta didik memiliki proses perkembangan yang berbeda. Melalui materi, aktivitas refleksi, dan pendampingan Guru BK, SI-PENA BK diharapkan membantu peserta didik mengambil langkah kecil yang bermakna—mulai dari mengenali diri, membangun kebiasaan baik, memperkuat relasi, hingga merencanakan masa depan. Setiap jawaban, refleksi, dan catatan perkembangan yang tersimpan menjadi bahan bagi Guru BK untuk mendampingi dengan lebih tepat, sehingga tidak ada peserta didik yang berjalan sendirian dalam proses tumbuhnya.</p></div><button class="btn outlinebtn" onclick="login('student')">Masuk ke Ruang Siswa →</button></section>

function resultTable(data){

 submissions.forEach(a=>{const st=state.students.find(s=>s.name===a.studentName&&s.kelas===a.studentClass)||{};const lesson=state.lessons.find(l=>String(l.id)===String(a.lessonId));rows.push({name:a.studentName,kelas:a.studentClass,lesson:lesson?.title||a.lkpdTitle||'LKPD',score:['A','B','C'].includes(String(st.score))?String(st.score):'Belum dinilai',submission:a,student:st,submittedAt:a.submittedAt})});

function downloadCSV(type){
 const subs=state.submissions||[];const lessonOf=id=>(state.lessons||[]).find(l=>Number(l.id)===Number(id))||{};
 const studentOf=a=>(state.students||[]).find(s=>s.name===a.studentName&&s.kelas===a.studentClass)||{};
 const cat=s=>['A','B','C'].includes(String(s.score))?String(s.score):'Belum dinilai';
 let rows,label;
 if(type==='siswa'){label='data-peserta-didik';rows=[['No','Nama Peserta Didik','Rombel','Jenis Kelamin','Status Akun','Aktivitas Terakhir','LKPD Terkirim','Kategori Perkembangan'],...(state.students||[]).map((s,i)=>[i+1,s.name,s.kelas,s.gender||'-',s.status||'Aktif',s.lesson||'-',subs.filter(a=>a.kind==='lkpd'&&a.studentName===s.name&&a.studentClass===s.kelas).length,cat(s)])];}
 else{label='hasil-evaluasi';const sorted=subs.slice().sort((a,b)=>new Date(b.submittedAt||b.updatedAt||0)-new Date(a.submittedAt||a.updatedAt||0));rows=[['No','Nama Peserta Didik','Rombel','Jenis Kegiatan','Judul Kegiatan','Bidang BK','Waktu Kirim','Pertanyaan Terjawab','Kategori Perkembangan'],...sorted.map((a,i)=>{const l=lessonOf(a.lessonId);const answered=Object.values(a.answers||{}).filter(v=>Array.isArray(v)?v.length:String(v||'').trim()).length;const t=a.submittedAt||a.updatedAt;return [i+1,a.studentName,a.studentClass,a.kind==='lkpd'?'LKPD':'Refleksi',a.kind==='lkpd'?(a.lkpdTitle||'LKPD'):('Refleksi · '+(l.title||'')),l.field||'-',t?new Date(t).toLocaleString('id-ID'):'-',answered,cat(studentOf(a))];})];}
 const safe=v=>{v=String(v==null?'':v);if(v!=='-'&&/^[=+\-@]/.test(v)&&isNaN(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};
 const csv=rows.map(r=>r.map(safe).join(',')).join('\r\n');
 const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`SI-PENA-BK-${label}-${new Date().toISOString().slice(0,10)}.csv`;a.click();URL.revokeObjectURL(url);
 toast(rows.length<2?'File CSV disiapkan, tetapi belum ada data untuk dimuat.':'File CSV berhasil disiapkan.');
}

const libraryStarterContent={
 materi:[
  {title:'Mengenal Diri dan Potensi',type:'Materi BK · Pribadi',field:'Pribadi',desc:'Panduan mengenali kekuatan, kebutuhan, nilai diri, dan hal yang ingin dikembangkan.',content:`MENGENAL DIRI DAN POTENSI

Mengenal diri berarti memahami perasaan, minat, kekuatan, nilai, serta hal yang masih ingin kita pelajari. Setiap orang memiliki keunikan dan dapat berkembang melalui latihan serta pengalaman.

Coba refleksikan pertanyaan berikut:
1. Kegiatan apa yang membuat saya bersemangat?
2. Kekuatan apa yang sering terlihat dari diri saya?
3. Tantangan apa yang sedang saya hadapi?
4. Siapa orang tepercaya yang dapat mendukung saya?
5. Satu kemampuan apa yang ingin saya latih minggu ini?

Ingat: potensi bukan sesuatu yang harus langsung sempurna. Kenali, latih, dan evaluasi secara bertahap.`},
  {title:'Mengelola Emosi dengan Sehat',type:'Materi BK · Pribadi',field:'Pribadi',desc:'Langkah sederhana mengenali emosi, memahami pemicunya, dan memilih respons yang aman.',content:`MENGELOLA EMOSI DENGAN SEHAT

Emosi adalah bagian wajar dari pengalaman manusia. Kita tidak selalu dapat memilih emosi yang muncul, tetapi kita dapat berlatih memilih cara meresponsnya.

Langkah yang bisa dicoba:
1. Berhenti sejenak dan tarik napas perlahan.
2. Beri nama emosi yang dirasakan, misalnya kecewa, takut, senang, atau cemas.
3. Kenali kejadian atau pikiran yang memicu emosi.
4. Pilih tindakan yang aman: minum air, menulis, bergerak sejenak, atau berbicara dengan orang tepercaya.
5. Evaluasi apa yang membantu dan apa yang ingin dicoba lain kali.

Jika perasaan terasa sangat berat atau mengganggu kegiatan sehari-hari, mintalah bantuan Guru BK atau orang dewasa tepercaya.`},
  {title:'Kebiasaan Belajar dan Manajemen Waktu',type:'Materi BK · Belajar',field:'Belajar',desc:'Strategi menyusun prioritas, memecah tugas, dan membangun rutinitas belajar yang realistis.',content:`KEBIASAAN BELAJAR DAN MANAJEMEN WAKTU

Kebiasaan belajar terbentuk dari langkah kecil yang dilakukan secara konsisten. Tidak harus belajar berjam-jam sekaligus; yang penting adalah tujuan jelas dan waktu yang realistis.

Strategi yang dapat dicoba:
• Catat tugas dan tenggatnya.
• Pilih satu tugas penting untuk mulai dikerjakan.
• Bagi tugas besar menjadi bagian kecil.
• Belajar dalam sesi singkat dengan jeda istirahat.
• Jauhkan gangguan yang tidak diperlukan, termasuk notifikasi gawai.
• Tinjau kembali jadwal dan sesuaikan bila terlalu berat.

  {title:'Komunikasi Positif dan Pertemanan Sehat',type:'Materi BK · Sosial',field:'Sosial',desc:'Membangun komunikasi saling menghargai, batasan diri, dan cara merespons konflik.',content:`KOMUNIKASI POSITIF DAN PERTEMANAN SEHAT

Pertemanan yang sehat memberi ruang bagi setiap orang untuk merasa aman, dihargai, dan menjadi diri sendiri. Perbedaan pendapat dapat terjadi; cara kita menyikapinya yang perlu dilatih.

Praktik komunikasi positif:

function libraryCards(){const cats=[{id:'materi',title:'Materi BK',desc:'Bahan bacaan, video, dan sumber belajar menurut bidang serta topik BK.',icon:icons.book,background:'linear-gradient(135deg,#ffe1f0,#f4e7ff)'},{id:'lkpd',title:'LKPD',desc:'Lembar kerja peserta didik untuk aktivitas, refleksi, dan tindak lanjut.',icon:icons.lkpdArt||icons.file,background:'linear-gradient(135deg,#e3e8ff,#e6f5ff)'},{id:'orangtua',title:'Panduan Orang Tua',desc:'Panduan praktis komunikasi, emosi, rutinitas belajar, dan dukungan anak di rumah.',icon:icons.book,background:'linear-gradient(135deg,#dff8ed,#effbe9)'},{id:'interaktif',title:'Media Interaktif',desc:'Kartu refleksi, latihan mengenali emosi, pemecahan masalah, dan kekuatan diri.',icon:icons.mediaArt||icons.video,background:'linear-gradient(135deg,#eee2ff,#fbe6f5)'},{id:'layanan',title:'Informasi Layanan BK',desc:'Jenis layanan, cara mengakses Guru BK, privasi, dan panduan meminta bantuan.',icon:icons.folder,background:'linear-gradient(135deg,#dff0ff,#e4fff5)'},{id:'dokumen',title:'Dokumen Lainnya',desc:'Template jurnal refleksi, lembar pemantauan tujuan, dan formulir konsultasi.',icon:icons.file,background:'linear-gradient(135deg,#fff0d9,#ffe5ee)'}];const q=(window.librarySearch||'').toLowerCase();return `<div class="lesson-grid library-grid">${cats.filter(c=>(c.title+' '+c.desc).toLowerCase().includes(q)).map(c=>{const saved=c.id==='lkpd'?((state.lkpds||[]).length+(state.materials||[]).filter(m=>(m.category||'materi')===c.id).length):(state.materials||[]).filter(m=>(m.category||'materi')===c.id).length;const starter=c.id==='lkpd'?0:(libraryStarterContent[c.id]||[]).length;return `<article class="lesson-card library-resource-card"><button class="library-card-button" onclick="openLibraryFolder('${c.id}')"><div class="lesson-art" style="background:${c.background}"><div class="library-art-inner">${c.icon}</div><span class="art-spark spark-one">✦</span><span class="art-spark spark-two">✧</span></div><div class="lesson-content"><h3>${c.title}</h3><p>${c.desc}</p><div class="lesson-meta"><span>${starter+saved} sumber tersedia</span><span>Jelajahi folder ↗</span></div></div></button></article>`}).join('')||'<div class="panel">Folder tidak ditemukan. Coba kata kunci lain.</div>'}</div>`}
function openLibraryFolder(category,typeFilter=null){
 const names={materi:'Materi BK',lkpd:'LKPD',orangtua:'Panduan Orang Tua',interaktif:'Media Interaktif',dokumen:'Dokumen Lainnya',layanan:'Informasi Layanan BK'};
 if(category==='lkpd'){
  const forms=(state.lkpds||[]);
  const isStudent=state.role==='student';
  const formRows=forms.map((k,i)=>{
   const submitted=isStudent&&(state.submissions||[]).some(a=>a.kind==='lkpd'&&Number(a.lkpdId)===Number(k.id)&&a.studentName===state.studentName&&a.studentClass===state.studentClass);
   return `<article class="material-row"><div class="material-type-art" style="background:${['#ffe5f2','#e5eaff','#e2f7ed','#fff0dc'][i%4]}">${icons.lkpdArt||icons.file}</div><div class="material-main"><strong>${escapeHtml(k.title)}</strong><span>LKPD Digital · ${escapeHtml((state.lessons.find(l=>Number(l.id)===Number(k.lessonId))||{}).field||'Bidang belum ditentukan')} · ${(k.questions||[]).length} pertanyaan</span><small>${escapeHtml(k.desc||'Lembar kerja digital yang disusun Guru BK.')}</small></div><div class="material-actions">${isStudent?(submitted?'<span class="pill" style="background:#e0f8ee;color:#148263">✓ Sudah terkirim</span>':`<button class="btn bluebtn tinybtn" onclick="openStudentLKPD(${Number(k.id)})">Kerjakan →</button>`):`<button class="btn bluebtn tinybtn" onclick="previewLibraryLKPD(${Number(k.id)})">Pratinjau</button><button class="btn outlinebtn tinybtn" onclick="editLKPD(${Number(k.id)})">Edit</button><button class="btn softbtn tinybtn" onclick="deleteLKPD(${Number(k.id)})">Hapus</button>`}</div></article>`;
  }).join('');
  showModal(`<div class="form-header"><span class="pill">${isStudent?'LEMBAR KERJA PESERTA DIDIK':'PENGELOLAAN LKPD DIGITAL'}</span><h2 style="margin-top:10px">LKPD</h2><p>${isStudent?'Pilih LKPD dari Guru BK, isi pertanyaan, lalu kirim jawabanmu. Setelah terkirim, statusnya akan terlihat di sini.':'Kelola LKPD yang akan dikerjakan peserta didik.'}</p></div>${formRows||`<div class="results-empty"><div class="empty-illustration">${icons.lkpdArt||icons.file}</div><strong>${isStudent?'Belum ada LKPD untuk dikerjakan':'Belum ada LKPD yang dibuat'}</strong><p>${isStudent?'LKPD akan muncul di sini setelah Guru BK membagikannya.':'Guru BK dapat membuat LKPD dari portal Guru BK.'}</p></div>`}${!isStudent?`<div style="display:flex;justify-content:center;padding:18px 0 4px"><button class="btn bluebtn" type="button" onclick="closeModal();openLKPDModal()">＋ Mulai buat LKPD →</button></div>`:''}`);
  return;
 }
 if(category==='materi'&&!typeFilter){
  const types=[
   {id:'PDF',title:'PDF',desc:'Modul dan bahan bacaan',art:'📑',bg:'linear-gradient(135deg,#ffe4f2,#f0e8ff)'},
   {id:'PowerPoint',title:'PowerPoint',desc:'Slide presentasi layanan BK',art:'▣',bg:'linear-gradient(135deg,#ffe7df,#fff0d9)'},
   {id:'Video',title:'Video',desc:'Video edukasi dan inspirasi',art:'▶',bg:'linear-gradient(135deg,#e2eaff,#f3e7ff)'},
   {id:'Link',title:'Link & lainnya',desc:'Tautan, materi bacaan, dan sumber lain',art:'↗',bg:'linear-gradient(135deg,#dff8ed,#e5f1ff)'}
  ];
  const saved=(state.materials||[]).filter(m=>(m.category||'materi')==='materi');
  const countFor=t=>saved.filter(m=>t.id==='Link'?!['PDF','PowerPoint','Video'].includes(m.type):m.type===t.id).length+(t.id==='Link'?(libraryStarterContent.materi||[]).length:0);
  showModal(`<div class="form-header"><span class="pill">PERPUSTAKAAN DIGITAL</span><h2 style="margin-top:10px">Materi BK</h2><p>Pilih jenis materi, lalu buka bahan yang tersedia. Materi bacaan SI-PENA BK juga tersedia pada bagian Link & lainnya.</p></div><div class="material-type-grid">${types.map(t=>`<button class="material-type-card" onclick="openLibraryFolder('materi','${t.id}')"><span class="material-type-banner" style="background:${t.bg}"><span class="material-type-symbol">${t.art}</span><span class="art-spark">✦</span></span><strong>${t.title}</strong><small>${t.desc}</small><span class="material-count">${countFor(t)} item</span></button>`).join('')}</div><div class="modal-actions"><button class="btn softbtn" onclick="closeModal()">Tutup</button>${state.role==='teacher'?`<button class="btn primary" onclick="closeModal();openMaterialModal(null,null,'materi')">＋ Tambah Materi</button>`:''}</div>`);
  return;
 }
 const saved=(state.materials||[]).filter(m=>(m.category||'materi')===category);
 let starters=(libraryStarterContent[category]||[]).map((r,i)=>({...r,_starter:true,_key:`${category}-${i}`}));
 if(category==='materi'&&typeFilter){saved.splice(0,saved.length,...saved.filter(m=>typeFilter==='Link'?!['PDF','PowerPoint','Video'].includes(m.type):m.type===typeFilter));starters=typeFilter==='Link'?starters:[];}
 const all=[...starters,...saved];
 const body=all.map((m,i)=>`<article class="material-row"><div class="material-type-art" style="background:${['#ffe5f2','#e5eaff','#e2f7ed','#fff0dc'][i%4]}">${m._starter?icons.book:materialIcon(m.type)}</div><div class="material-main"><strong>${escapeHtml(m.title)}</strong><span>${escapeHtml(m.type||'Materi')} · ${escapeHtml(m.field||'Bahan pendamping layanan BK')}</span><small>${escapeHtml(m.desc||'')}</small></div><div class="material-actions"><button class="btn bluebtn tinybtn" onclick="${m._starter?`openStarterResource('${m._key}')`:`openMaterial(${m.id})`}">${m._starter?'Baca':'Buka'}</button>${!m._starter&&state.role==='teacher'?`<button class="btn outlinebtn tinybtn" onclick="openMaterialModal(${m.id})">Edit</button><button class="btn softbtn tinybtn" onclick="deleteMaterial(${m.id})">Hapus</button>`:''}</div></article>`).join('');
 const back=category==='materi'&&typeFilter?`<button class="btn softbtn" onclick="openLibraryFolder('materi')">← Jenis Materi</button>`:'';
 showModal(`<div class="form-header"><span class="pill">PERPUSTAKAAN DIGITAL</span><h2 style="margin-top:10px">${names[category]||'Perpustakaan'}${typeFilter?' · '+(typeFilter==='Link'?'Link & lainnya':typeFilter):''}</h2><p>${typeFilter==='PDF'?'Kumpulan dokumen PDF yang ditambahkan Guru BK.':typeFilter==='PowerPoint'?'Kumpulan presentasi pembelajaran dan layanan BK.':typeFilter==='Video'?'Kumpulan video edukasi yang dapat dibuka melalui tautan.':typeFilter==='Link'?'Materi bacaan dan sumber pendamping yang dapat langsung dibaca.':'Pilih bahan pendamping yang tersedia. Guru BK juga dapat menambahkan file atau tautan milik sekolah.'}</p></div>${body||`<div class="results-empty"><div class="empty-illustration">${icons.book}</div><strong>Belum ada sumber di bagian ini</strong><p>Guru BK dapat menambahkan materi atau tautan yang sesuai kebutuhan sekolah.</p></div>`}<div class="modal-actions">${back}<button class="btn softbtn" onclick="closeModal()">Tutup</button>${state.role==='teacher'?`<button class="btn primary" onclick="closeModal();openMaterialModal(null,null,'${category}','${typeFilter||''}')">＋ Tambah Materi</button>`:''}</div>`)
}
function previewLibraryLKPD(id){const k=(state.lkpds||[]).find(x=>Number(x.id)===Number(id));if(!k)return;showModal(`<div class="form-header"><span class="pill">PRATINJAU LKPD</span><h2 style="margin-top:10px">${escapeHtml(k.title)}</h2><p>${escapeHtml(k.desc||'Petunjuk pengerjaan LKPD.')}</p></div><div class="starter-content">${(k.questions||[]).map((q,i)=>`<article class="question-card"><span class="pill">PERTANYAAN ${i+1}${q.required?' · WAJIB':''}</span><h3>${escapeHtml(q.label)}</h3><p class="muted">Jenis jawaban: ${escapeHtml(q.type)}</p>${['Pilihan ganda','Kotak centang','Dropdown'].includes(q.type)?`<ul>${(q.options||[]).map(o=>`<li>${escapeHtml(o)}</li>`).join('')}</ul>`:''}</article>`).join('')||'<p>Belum ada pertanyaan.</p>'}</div><div class="modal-actions"><button class="btn softbtn" onclick="closeModal();openLibraryFolder('lkpd')">← Kembali ke LKPD</button><button class="btn outlinebtn" onclick="editLKPD(${Number(k.id)})">Edit formulir</button></div>`)}
function openStarterResource(key){const [category,indexText]=key.split('-');const item=(libraryStarterContent[category]||[])[Number(indexText)];if(!item)return;showModal(`<div class="form-header"><span class="pill">${escapeHtml(item.type)}</span><h2 style="margin-top:10px">${escapeHtml(item.title)}</h2><p>${escapeHtml(item.desc)}</p></div><div class="starter-content">${escapeHtml(item.content).split('\n').map(line=>line?`<p>${line}</p>`:'<div class="starter-spacer"></div>').join('')}</div><div class="modal-actions"><button class="btn softbtn" onclick="closeModal();openLibraryFolder('${category}')">← Kembali ke folder</button><button class="btn primary" onclick="window.print()">Cetak / Simpan PDF</button></div>`)}

function renderMaterialModal_(m){

 const lower=name.toLowerCase();
 const isPdf=lower.endsWith('.pdf');

 }else if(m.fileData){
   const href=materialObjectUrl_(m.fileData);
   filePanel=`<div class="panel"><p>File: <b>${escapeHtml(name)}</b></p><div class="modal-actions" style="justify-content:flex-start;flex-wrap:wrap"><a class="btn primary" href="${href}" target="_blank" rel="noopener">${openLabel}</a><a class="btn outlinebtn" href="${href}" download="${escapeHtml(name)}">${downloadLabel}</a></div></div>`;
 }else if(m.url){
   filePanel=`<div class="panel"><p>Materi dibuka melalui tautan yang disimpan.</p><div class="modal-actions" style="justify-content:flex-start;flex-wrap:wrap"><a class="btn primary" href="${escapeHtml(m.url)}" target="_blank" rel="noopener">Buka materi di tab baru ↗</a></div><p class="form-note">Jika tautan mengarah ke Google Drive, pastikan izin berbagi file sudah sesuai.</p></div>`;

}

v><div class="field"><label>Atau unggah file langsung dari perangkat</label><input name="uploadFile" id="materialUploadFile" type="file" accept=".pdf,.doc,.docx,.ppt,.pptx,.jpg,.jpeg,.png,.mp4,.txt"><div class="material-upload-note">Boleh pilih tautan atau unggah file. Maksimal 25 MB per file. File disimpan langsung di Google Drive.${old?.fileName?`<br>File tersimpan saat ini: <b>${escapeHtml(old.fileName)}</b>`:''}</div></div><div class="field"><label>Deskripsi</label><textarea name="desc" rows="3" placeholder="Keterangan singkat materi">${escapeHtml(old?.desc||'')}</textarea></div><div class="modal-actions"><button type="button" class="btn softbtn" onclick="closeModal()">Batal</button><button class="btn primary" type="submit">${old?'Simpan Perubahan':'Simpan Materi'}</button></div></form>`);$('#materialForm').addEventListener('submit',e=>{e.preventDefault();const form=e.target;const f=new FormData(form);const upload=form.querySelector('[name="uploadFile"]').files[0];if(upload&&upload.size>25*1024*1024){toast('Ukuran file maksimal 25 MB. Untuk file lebih besar, tempel tautan Google Drive.');return;}const commitMaterial=(fileData='',fileName='',driveId='')=>{const lid=f.get('lessonId');const l=state.lessons.find(x=>Number(x.id)===Number(lid));const data={id:old?.id||Date.now(),title:String(f.get('title')).trim(),category:f.get('category'),type:f.get('type'),field:f.get('field'),lessonId:lid?Number(lid):null,lessonTitle:l?.title||'Materi umum',url:String(f.get('url')||'').trim(),desc:String(f.get('desc')||'').trim()};if(fileData||driveId){if(driveId){data.driveId=driveId;data.fileData='';}else data.fileData=fileData;data.fileName=fileName;const ext=(fileName.split('.').pop()||'').toLowerCase();const typeByExt={pdf:'PDF',ppt:'PowerPoint',pptx:'PowerPoint',mp4:'Video',webm:'Video',mov:'Video',doc:'Word',docx:'Word',jpg:'Dokumen lainnya',jpeg:'Dokumen lainnya',png:'Dokumen lainnya',txt:'Link'};data.type=typeByExt[ext]||data.type;}else if(old){data.fileData=old.fileData| function openStudentLesson(id){const l=state.lessons.find(x=>x.id===id);if(!l)return;const forms=state.lkpds.filter(k=>Number(k.lessonId)===Number(id));const mine=(state.submissions||[]).filter(a=>a.studentName===state.studentName&&Number(a.lessonId)===Number(id));showModal(`<h2>${escapeHtml(l.title)}</h2><p>${escapeHtml(l.desc)}</p><div class="panel" style="padding:14px;margin:12px 0"><b>Aktivitas pembelajaran</b><p class="muted small">Baca materi dari Guru BK, lalu kerjakan LKPD yang tersedia.</p></div><h3>LKPD terkait</h3>${forms.length?forms.map(k=>{const sub=mine.find(a=>a.lkpdId===k.id);return `<div class="activity-row"><div class="activity-dot">${icons.file}</div><div style="flex:1"><strong>${escapeHtml(k.title)}</strong><small style="display:block">${escapeHtml(k.type)} · ${k.questions.length} pertanyaan · ${sub?'Sudah dikumpulkan':'Belum dikerjakan'}</small></div><button class="btn bluebtn tinybtn" onclick="openStudentLKPD(${k.id})">${sub?'Lihat / Ubah':'Kerjakan'}</button></div>`}).join(''):'<p class="muted">Belum ada LKPD untuk pembelajaran ini. Guru BK dapat menambahkannya melalui menu Kelola LKPD.</p>'}<div class="field"><label>Refleksi pembelajaran (opsional)</label><textarea id="reflectionText" rows="3" placeholder="Apa hal penting yang kamu pelajari hari ini?">${escapeHtml((state.submissions||[]).find(a=>a.studentName===state.studentName&&a.lessonId===id&&a.kind==='reflection')?.answers?.reflection||'')}</textarea></div><div class="modal-actions"><button class="btn softbtn" onclick="closeModal()">Tutup</button><button class="btn bluebtn" onclick="saveReflection(${id})">Simpan Refleksi</button></div>`)}

ass="field">${control}</div></article>`}).join('')}</div><div class="modal-actions"><button type="button" class="btn softbtn" onclick="closeModal()">Kembali</button><button type="submit" class="btn bluebtn">${old?'Perbarui jawaban':'Kirim jawaban'}</button></div></form>`);$('#studentLKPDForm').addEventListener('submit',e=>{e.preventDefault();const submitBtn=e.target.querySelector('button[type="submit"]');if(submitBtn?.disabled)return;if(submitBtn){submitBtn.disabled=true;submitBtn.textContent='Mengirim…';}const f=new FormData(e.target),out={};for(let i=0;i<k.questions.length;i++){const q=k.questions[i];let v=q.type==='Kotak centang'?f.getAll('q_'+i):f.get('q_'+i);if(q.required&&(!v||(Array.isArray(v)&&!v.length))){toast('Lengkapi pertanyaan wajib terlebih dahulu.');if(submitBtn){submitBtn.disabled=false;submitBtn.textContent=old?'Perbarui jawaban':'Kirim jawaban';}return}out[i]=v}state.submissions=state.submissions||[];const now=new Date().toISOString();if(old){old.answers=out;old.updatedAt=now;old.submittedAt=now}else state.submissions.push({id:Date.now(),kind:'lkpd',lkpdId:k.id,lkpdTitle:k.title,lessonId:Number(k.lessonId),studentName:state.studentName,studentClass:state.studentClass,answers:out,submittedAt:now});const student=state.students.find(s=>s.name===state.studentName&&s.kelas===state.studentClass);if(student){student.status='Selesai';student.lesson=k.title;student.lastActivity=now;student.score=student.score||''}persistState((saved)=>{closeModal();if(!saved){showModal(`<div style="text-align:center;padding:24px 12px"><h2>Jawaban belum terkonfirmasi</h2><p>Jawaban masih ada di perangkat ini, tetapi database pusat belum mengonfirmasi penyimpanannya. Periksa koneksi internet lalu coba kirim kembali.</p><div class="modal-actions" style="justify-content:center"><button class="btn softbtn" onclick="closeModal()">Tutup</button><button class="btn bluebtn" onclick="retryPendingSubmission()">Coba lagi</button></div></div>`);return;}renderDashboard();showModal(`<div function openStudentModal(){showModal(`<h2>Tambah Peserta Didik</h2><p>Lengkapi data peserta didik yang ingin ditambahkan.</p><form id="newStudentForm"><div class="field"><label>Nama lengkap</label><input name="name" required></div><div class="field"><label>Kelas</label><select name="kelas">${['VII','VIII','IX'].flatMap(t=>'ABCDEFGHIJK'.split('').map(c=>t+' '+c)).map(c=>`<option>${c}</option>`).join('')}</select></div><div class="field"><label>Jenis kelamin</label><select name="gender" required><option value="">Pilih jenis kelamin</option><option value="Laki-laki">Laki-laki</option><option value="Perempuan">Perempuan</option></select><small class="muted">Data ini digunakan untuk menyesuaikan ilustrasi profil siswa.</small></div><div class="modal-actions"><button type="button" class="btn softbtn" onclick="closeModal()">Batal</button><button class="btn primary">Simpan</button></div></form>`);$('#newStudentForm').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);const name=f.get('name').trim();if(state.students.some(s=>s.name.toLowerCase()===name.toLowerCase()&&s.kelas===f.get('kelas'))){toast('Nama dan kelas tersebut sudah terdaftar.');return}state.students.push({name,kelas:f.get('kelas'),gender:f.get('gender')||'Laki-laki',lesson:'Belum ada aktivitas',status:'Aktif',score:''});persistState();closeModal();renderDashboard();toast('Data peserta didik berhasil ditambahkan. Siswa dapat login dengan kode akses 1234.')})}
function viewStudent(name){const s=state.students.find(x=>x.name===name);if(!s)return;showModal(`<h2>Detail Peserta Didik</h2><p>Data pribadi yang tersimpan di SI-PENA BK.</p><div class="field"><label>Nama peserta didik</label><input value="${escapeHtml(s.name)}" readonly></div><div class="field"><label>Kelas / rombel</label><input value="${escapeHtml(s.kelas)}" readonly></div><div class="field"><label>Jenis kelamin</label><input value="${escapeHtml(s.gender||'Belum diisi')}" readonly></div><div class="field"><label>Status</label><input value="${escapeHtml(s.status||'Aktif')}" readonly></div><div class="modal-actions"><button class="btn softbtn" onclick="closeModal()">Tutup</button></div>`)}
function deleteStudent(name){const s=state.students.find(x=>x.name===name);if(!s)return;showModal(`<h2>Hapus Data Peserta Didik?</h2><p>Data <b>${escapeHtml(s.name)}</b> kelas ${escapeHtml(s.kelas)} akan dihapus bersama seluruh jawaban LKPD dan aktivitas yang terkait. Siswa tidak akan dapat login lagi setelah perubahan tersimpan di database pusat.</p><div class="modal-actions"><button class="btn softbtn" onclick="closeModal()">Batal</button><button class="btn primary" onclick="confirmDeleteStudent('${escapeJs(s.name)}','${escapeJs(s.kelas)}')">Hapus Data</button></div>`)}
function confirmDeleteStudent(name,kelas){
 const norm=v=>String(v||'').trim().toLowerCase();
 const targetName=norm(name),targetClass=norm(kelas);
 const belongsToStudent=x=>{const n=norm(x.studentName||x.name),c=norm(x.studentClass||x.kelas);return n===targetName&&(!c||c===targetClass)};
 state.students=(state.students||[]).filter(x=>!(norm(x.name)===targetName&&norm(x.kelas)===targetClass));
 (state.deletedSubmissionIds=state.deletedSubmissionIds||[]).push(...(state.submissions||[]).filter(belongsToStudent).map(x=>x.id));state.submissions=(state.submissions||[]).filter(x=>!belongsToStudent(x));
 state.activities=(state.activities||[]).filter(x=>!belongsToStudent(x));
 persistState();closeModal();renderDashboard();
 toast('Data siswa, seluruh jawaban LKPD, dan aktivitas terkait berhasil dihapus.');
}

function showModal(content){$('#modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><section class="modal">${content}</section></div>`}
function closeModal(){$('#modalRoot').innerHTML=''}
function initials(name){return name.split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function escapeJs(v){return String(v??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'")}

function stat(label,value,icon,bg,fg,caption){return `<article class="stat"><div class="stat-top"><span>${escapeHtml(label)}</span><span class="stat-icon" style="background:${bg};color:${fg}">${icon||''}</span></div><strong>${escapeHtml(value)}</strong><span>${escapeHtml(caption||'')}</span></article>`}
function mappingPanel(){
 const colors={A:'#9b7bed',B:'#6ba4f7',C:'#f078a6'},total=state.students.filter(s=>['A','B','C'].includes(String(s.score))).length;
 const counts={A:state.students.filter(s=>String(s.score)==='A').length,B:state.students.filter(s=>String(s.score)==='B').length,C:state.students.filter(s=>String(s.score)==='C').length};
 const pct=k=>total?Math.round(counts[k]/total*100):0;const a=pct('A'),b=pct('B'),c=Math.max(0,100-a-b);
 return `<div class="mapping-visual"><button class="donut-chart" aria-label="Pemetaan kategori A B C" style="background:conic-gradient(${colors.A} 0 ${a}%,${colors.B} ${a}% ${a+b}%,${colors.C} ${a+b}% 100%)" onclick="showCategory('A')"><span><strong>${total}</strong><small>Hasil<br>penilaian</small></span></button><div class="mapping-legend">${[['A','Berkembang baik'],['B','Sedang berkembang'],['C','Perlu pendampingan']].map(([k,label])=>`<button class="mapping-legend-row" onclick="showCategory('${k}')"><span class="legend-dot" style="background:${colors[k]}"></span><span>${k} (${label})</span><strong>${pct(k)}%</strong><small>${counts[k]} siswa</small></button>`).join('')}</div></div><p class="form-note mapping-note">Hanya hasil yang sudah diberi kategori yang dihitung. Siswa yang belum dinilai tidak otomatis masuk kategori A, B, atau C.</p>`;
}
function fieldRecapPanel(){
 const fields=['Pribadi','Belajar','Sosial','Karier'];const colors={A:'#a78bfa',B:'#75aaf7',C:'#f47ca7'};
 return `<div class="field-chart">${fields.map(f=>{const lessons=state.lessons.filter(l=>l.field===f);const counts={A:0,B:0,C:0};state.students.forEach(s=>{if(['A','B','C'].includes(String(s.score))&&lessons.some(l=>String(l.id)===String(s.lessonId)||l.title===s.lesson))counts[s.score]++});const max=Math.max(1,...Object.values(counts));return `<div class="field-chart-row"><div class="field-chart-title"><strong>${f}</strong><span>${lessons.length} topik</span></div><div class="field-bars">${['A','B','C'].map(k=>`<div class="field-bar-wrap"><span>${counts[k]}</span><div class="field-bar" style="height:${Math.max(4,counts[k]/max*64)}px;background:${colors[k]}"></div><small>${k}</small></div>`).join('')}</div></div>`}).join('')}</div><div class="field-legend"><span><i style="background:${colors.A}"></i>A · Berkembang baik</span><span><i style="background:${colors.B}"></i>B · Sedang berkembang</span><span><i style="background:${colors.C}"></i>C · Perlu pendampingan</span></div><p class="form-note">Rekap dihitung dari kategori peserta didik yang sudah ditetapkan dan dikaitkan dengan bidang pembelajarannya.</p>`;
}
function showCategory(k){const a=state.students.filter(s=>String(s.score)===k);showModal(`<h2>Pemetaan Perkembangan — Kategori ${k}</h2><p>${a.length} peserta didik pada kategori ${k} ().</p>${a.map(s=>`<div class="activity-row"><div class="mini-avatar">${initials(s.name)}</div><div style="flex:1"><strong>${escapeHtml(s.name)}</strong><small style="display:block">${s.kelas} · ${s.lesson}</small></div><button class="btn primary tinybtn" onclick="closeModal();downloadStudentPDF('${escapeJs(s.name)}')">PDF</button></div>`).join('')||'<p>Belum ada siswa pada kategori ini.</p>'}<div class="modal-actions"><button class="btn softbtn" onclick="closeModal()">Tutup</button></div>`)}
function lkpdPage(){return `<div class="section-head" style="margin-top:0"><div><h2>Kelola LKPD</h2><p>Tambahkan, edit, atau hapus lembar kerja dan kaitkan dengan pembelajaran.</p></div><button class="btn primary" onclick="openLKPDModal()">＋ Tambah LKPD</button></div><div class="lesson-grid">${state.lkpds.map(k=>`<article class="lesson-card"><div class="lesson-art" style="background:linear-gradient(135deg,#ffe1f0,#e4e9ff)">${icons.file||icons.folderSmall}</div><div class="lesson-content"><span class="pill">${escapeHtml(k.type)}</span><h3>${escapeHtml(k.title)}</h3><p>Pembelajaran ${k.lessonId} · ${escapeHtml(k.desc)}</p><div style="display:flex;gap:7px"><button class="btn outlinebtn tinybtn" style="flex:1" onclick="editLKPD(${k.id})">Edit</button><button class="btn softbtn tinybtn" onclick="deleteLKPD(${k.id})">Hapus</button></div></div></article>`).join('')}</div><p class="form-note">LKPD yang disimpan di sini akan muncul pada portal siswa sesuai pembelajaran yang dipilih.</p>`}
function openLKPDModal(old){
 const k=old||{title:'',lessonId:state.lessons[0]?.id||1,type:'Refleksi',desc:'',questions:[]};
 window.lkpdQuestions=(k.questions||[]).map(q=>({...q,options:[...(q.options||[])]}));
 const choiceTypes=['Pilihan ganda','Kotak centang','Dropdown'];
 const esc=escapeHtml;
 window.lkpdRenderQuestions=()=>{
  const qs=window.lkpdQuestions;
  if(!qs.length)return '<div class="form-header"><b>Belum ada pertanyaan</b><p>Tambahkan pertanyaan dan tentukan jenis jawaban yang ingin digunakan.</p></div>';
  return qs.map((q,i)=>{
   const isChoice=choiceTypes.includes(q.type);
   const symbol=q.type==='Pilihan ganda'?'radio':q.type==='Kotak centang'?'check':'';
   const options=isChoice?(q.options||[]).map((op,j)=>`<div class="option-row"><span class="option-symbol ${symbol}"></span><input type="text" value="${esc(op)}" aria-label="Pilihan ${j+1}" placeholder="Pilihan ${j+1}" oninput="window.lkpdQuestions[${i}].options[${j}]=this.value"><button type="button" class="btn softbtn tinybtn" aria-label="Hapus pilihan" onclick="window.lkpdQuestions[${i}].options.splice(${j},1);document.getElementById('questionEditor').innerHTML=window.lkpdRenderQuestions()">Hapus</button></div>`).join(''):'';
   let preview=q.type==='Jawaban singkat'?'<input disabled placeholder="Jawaban singkat" style="width:min(100%,360px);border:0;border-bottom:1px solid #dfe4f1;padding:10px 2px">':q.type==='Paragraf'?'<textarea disabled rows="2" placeholder="Jawaban panjang" style="width:100%;max-width:460px;border:0;border-bottom:1px solid #dfe4f1;padding:10px 2px"></textarea>':q.type==='Dropdown'?`<select disabled style="width:min(100%,360px);padding:11px;border:1px solid #dfe4f1;border-radius:9px"><option>Pilih jawaban</option>${(q.options||[]).map(o=>`<option>${esc(o)}</option>`).join('')}</select>`:isChoice?options:'';
   return `<article class="question-card"><div class="question-top"><span class="pill">PERTANYAAN ${i+1}</span><button type="button" class="btn softbtn tinybtn" onclick="window.lkpdQuestions.splice(${i},1);document.getElementById('questionEditor').innerHTML=window.lkpdRenderQuestions()">Hapus pertanyaan</button></div><div class="field"><label>Teks pertanyaan</label><input type="text" value="${esc(q.label||'')}" oninput="window.lkpdQuestions[${i}].label=this.value" placeholder="Tulis pertanyaan di sini" required></div><div class="field"><label>Jenis jawaban</label><select onchange="window.lkpdChangeType(${i},this.value)">${['Jawaban singkat','Paragraf','Pilihan ganda','Kotak centang','Dropdown'].map(t=>`<option value="${t}" ${q.type===t?'selected':''}>${t}</option>`).join('')}</select></div>${isChoice?`<div class="builder-subtitle">Pilihan jawaban — klik teks untuk mengubahnya</div>${options}<button type="button" class="add-option" onclick="window.lkpdQuestions[${i}].options.push('Pilihan baru');document.getElementById('questionEditor').innerHTML=window.lkpdRenderQuestions()">＋ Tambahkan pilihan</button>`:`<div class="builder-subtitle">Pratinjau jawaban</div>${preview}`}<div class="question-tools"><label><input type="checkbox" ${q.required?'checked':''} onchange="window.lkpdQuestions[${i}].required=this.checked"> Wajib diisi</label><span class="builder-subtitle">${q.required?'Peserta didik harus menjawab pertanyaan ini':'Pertanyaan opsional'}</span></div></article>`;
  }).join('');
 };
 window.lkpdChangeType=(i,type)=>{const q=window.lkpdQuestions[i];q.type=type;if(choiceTypes.includes(type)&&!q.options?.length)q.options=['Pilihan 1','Pilihan 2'];if(!choiceTypes.includes(type))q.options=[];document.getElementById('questionEditor').innerHTML=window.lkpdRenderQuestions()};
 showModal(`<div class="form-header"><span class="pill">PEMBUAT FORMULIR LKPD</span><h2 style="margin-top:12px">${old?'Edit LKPD':'Buat LKPD baru'}</h2><p>Susun lembar kerja digital dengan jenis pertanyaan dan pilihan jawaban yang dapat diubah seperti Google Formulir.</p></div><form id="lkpdForm"><div class="form-header"><div class="field"><label>Judul formulir *</label><input name="title" required value="${esc(k.title)}" placeholder="Contoh: Refleksi Mengenal Diri"></div><div class="field"><label>Deskripsi / petunjuk</label><textarea name="desc" rows="3" placeholder="Petunjuk pengerjaan untuk peserta didik">${esc(k.desc)}</textarea></div><div class="field"><label>Pembelajaran terkait</label><select name="lessonId">${state.lessons.map(l=>`<option value="${l.id}" ${Number(k.lessonId)===l.id?'selected':''}>${esc(l.field)} — ${esc(l.title)}</option>`).join('')}</select></div><div class="field"><label>Kategori LKPD</label><select name="type">${['Refleksi','Latihan','Diskusi','Asesmen diri','Rencana aksi','Evaluasi','Kuis'].map(t=>`<option ${k.type===t?'selected':''}>${t}</option>`).join('')}</select></div></div><div id="questionEditor">${window.lkpdRenderQuestions()}</div><button type="button" class="builder-add" id="addQuestion">＋ Tambahkan pertanyaan</button><div class="modal-actions"><button type="button" class="btn softbtn" onclick="closeModal()">Batal</button><button class="btn primary" type="submit">${old?'Simpan perubahan':'Simpan formulir'}</button></div></form>`);
 $('#addQuestion').addEventListener('click',()=>{window.lkpdQuestions.push({label:'',type:'Pilihan ganda',required:true,options:['Pilihan 1','Pilihan 2']});$('#questionEditor').innerHTML=window.lkpdRenderQuestions();const cards=$$('#questionEditor .question-card');cards[cards.length-1]?.scrollIntoView({behavior:'smooth',block:'nearest'})});
 $('#lkpdForm').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);const qs=window.lkpdQuestions.map(q=>({...q,label:(q.label||'').trim(),options:(q.options||[]).map(o=>o.trim()).filter(Boolean)}));if(qs.some(q=>!q.label)){toast('Lengkapi teks semua pertanyaan terlebih dahulu.');return}if(qs.some(q=>choiceTypes.includes(q.type)&&q.options.length<2)){toast('Setiap pertanyaan pilihan harus memiliki minimal dua pilihan jawaban.');return}const data={id:old?old.id:Math.max(0,...state.lkpds.map(x=>x.id))+1,title:f.get('title').trim(),lessonId:Number(f.get('lessonId')),type:f.get('type'),desc:f.get('desc').trim(),questions:qs};if(old)state.lkpds=state.lkpds.map(x=>x.id===old.id?data:x);else state.lkpds.push(data);persistState();closeModal();renderDashboard();toast(old?'Formulir LKPD berhasil diperbarui.':'Formulir LKPD berhasil dibuat.')});
}

function editLKPD(id){const k=state.lkpds.find(x=>x.id===id);if(k)openLKPDModal(k)}
function deleteLKPD(id){const k=state.lkpds.find(x=>x.id===id);if(!k)return;showModal(`<h2>Hapus LKPD?</h2><p>LKPD “${escapeHtml(k.title)}” akan dihapus dari daftar.</p><div class="modal-actions"><button class="btn softbtn" onclick="closeModal()">Batal</button><button class="btn primary" onclick="state.lkpds=state.lkpds.filter(x=>x.id!==${id});persistState();closeModal();renderDashboard();toast('LKPD berhasil dihapus.')">Ya, Hapus</button></div>`)}
function deleteLesson(id){const l=state.lessons.find(x=>x.id===id);if(!l)return;showModal(`<h2>Hapus Pembelajaran?</h2><p>“${escapeHtml(l.title)}” akan dihapus dari daftar.</p><div class="modal-actions"><button class="btn softbtn" onclick="closeModal()">Batal</button><button class="btn primary" onclick="state.lessons=state.lessons.filter(x=>x.id!==${id});state.lessons.forEach((x,i)=>x.id=i+1);persistState();closeModal();renderDashboard();toast('Pembelajaran dihapus.')">Ya, Hapus</button></div>`)}
function downloadStudentPDF(name,cls){const esc=escapeHtml;const self=state.role==='student';const klass=cls||(self?state.studentClass:'');const s=state.students.find(x=>x.name===name&&(!klass||x.kelas===klass))||{name,kelas:klass||state.studentClass,lesson:'Belum ada riwayat',status:'Belum',score:'Belum dinilai'};const meaning={A:'Berkembang sangat baik',B:'Sedang berkembang',C:'Memerlukan pendampingan lebih lanjut'};const w=window.open('','_blank');if(!w){toast('Izinkan pop-up untuk membuat laporan.');return}const date=new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});const cat=['A','B','C'].includes(String(s.score));const mine=(state.submissions||[]).filter(a=>a.studentName===s.name&&a.studentClass===s.kelas).slice().sort((a,b)=>new Date(b.submittedAt||b.updatedAt||0)-new Date(a.submittedAt||a.updatedAt||0));const lessonOf=id=>(state.lessons||[]).find(l=>Number(l.id)===Number(id))||{};
w.document.write(`${reportHead_('Laporan Individu '+esc(s.name)+' - SI-PENA BK')}<header class="hero"><div><div class="brand">SI-PENA BK · ${self?'LAPORAN PERKEMBANGANKU':'LAPORAN INDIVIDU'}</div><h1>${self?'Laporan Perkembanganku':'Laporan Perkembangan Peserta Didik'}</h1><p>${self?'Ringkasan perjalanan belajar dan pemetaan perkembanganmu pada layanan Bimbingan dan Konseling.':'Ringkasan pemetaan dan aktivitas belajar peserta didik pada layanan Bimbingan dan Konseling.'}<br>Tanggal laporan: ${date}</p></div><div class="seal">BK</div></header><section class="identity"><div><span class="label">Nama Peserta Didik</span><span class="value">${esc(s.name)}</span></div><div><span class="label">Kelas / Rombel</span><span class="value">${esc(s.kelas)}</span></div><div><span class="label">Pembelajaran terakhir</span><span class="value">${esc(s.lesson||'-')}</span></div><div><span class="label">Status aktivitas</span><span class="value">${esc(s.status||'-')}</span></div></section><section class="category"><div class="letter ${cat?String(s.score).toLowerCase():''}">${cat?esc(s.score):'—'}</div><div><h2>${cat?'Kategori Pemetaan: '+esc(s.score):'Status Pemetaan: Belum dinilai'}</h2><p>${meaning[s.score]||'Pemetaan perkembangan akan ditetapkan oleh Guru BK setelah peninjauan.'}</p></div></section>
<section class="section"><h2>Rekap Progress Pembelajaran</h2><table><thead><tr><th>No.</th><th>Topik Pembelajaran</th><th>Bidang</th><th>Materi</th><th>LKPD</th><th>Status</th></tr></thead><tbody>${(state.lessons||[]).map((l,i)=>{const sent=mine.some(a=>Number(a.lessonId)===Number(l.id));return `<tr><td>${i+1}</td><td>${esc(l.title)}</td><td>${esc(l.field||'-')}</td><td>${l.materi??'-'}</td><td>${l.lkpd??'-'}</td><td><span class="badge ${sent?'ok':''}">${sent?'Sudah mengerjakan':'Belum mengerjakan'}</span></td></tr>`}).join('')||'<tr><td colspan="6">Belum ada topik pembelajaran.</td></tr>'}</tbody></table></section>
<section class="section"><h2>Riwayat Kegiatan</h2><table><thead><tr><th>No.</th><th>Kegiatan</th><th>Bidang</th><th>Waktu Kirim</th></tr></thead><tbody>${mine.map((a,i)=>{const t=a.submittedAt||a.updatedAt;return `<tr><td>${i+1}</td><td>${a.kind==='lkpd'?esc(a.lkpdTitle||'LKPD'):'Refleksi · '+esc(lessonOf(a.lessonId).title||'')}</td><td>${esc(lessonOf(a.lessonId).field||'-')}</td><td>${t?new Date(t).toLocaleString('id-ID'):'-'}</td></tr>`}).join('')||'<tr><td colspan="4">Belum ada kegiatan yang dikirim.</td></tr>'}</tbody></table></section>
<div class="foot"><b>Catatan untuk Peserta Didik</b><p>Setiap peserta didik berkembang dengan cara dan waktunya masing-masing. Gunakan laporan ini untuk mengenali hal yang sudah baik dan menentukan langkah kecil berikutnya bersama Guru BK. Periksa kesesuaian data sebelum digunakan sebagai dokumen layanan.</p></div>${reportSign_()}${reportTail_()}`);w.document.close()}

window.addEventListener('error',e=>{console.error('SI-PENA BK error:',e.message,e.error);});
startApp();
</script>

@keyframes haWrite{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(-5px,4px) rotate(-5deg)}}

@keyframes haKnob{0%,100%{transform:translateX(0)}50%{transform:translateX(-24px)}}
/* Scene landing */
.sc *{transform-box:fill-box;transform-origin:center}
.sc-sun{animation:haSpin 40s linear infinite}
.sc-cloud{animation:scCloud 18s ease-in-out infinite}.sc-cloud.c2{animation-duration:24s;animation-direction:reverse}
.sc-bird{animation:haFl 3s ease-in-out infinite}
.sc-flag{transform-origin:left center!important;animation:scFlag 1.6s ease-in-out infinite}
.sc-hand{transform-origin:0 0!important;animation:haSpin 12s linear infinite}
.sc-win rect{animation:scWin 4s ease-in-out infinite}.sc-win rect:nth-child(2n){animation-delay:-1.5s}.sc-win rect:nth-child(3n){animation-delay:-2.7s}
.sc-heart{animation:haPulse 1.8s ease-in-out infinite}
.sc-tree{transform-origin:50% 100%!important;animation:scSway 5s ease-in-out infinite}.sc-tree.t2{animation-delay:-2s}
.sc-kid{animation:haBob 2.6s ease-in-out infinite}.sc-kid.k2{animation-delay:-1.2s}
.sc-book{animation:haFl 4s ease-in-out infinite}
.sc-spark{animation:haTw 2.6s ease-in-out infinite}
@keyframes scCloud{0%,100%{transform:translateX(-12px)}50%{transform:translateX(14px)}}
@keyframes scFlag{0%,100%{transform:scaleX(1) skewY(0)}50%{transform:scaleX(.8) skewY(6deg)}}
@keyframes scWin{0%,100%{opacity:1}50%{opacity:.72}}
@keyframes scSway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
/* Chip landing: selalu satu baris di semua perangkat */
.landing-page .hero-trust{flex-direction:row!important;flex-wrap:nowrap!important;gap:clamp(5px,1.4cqw,10px)!important;justify-content:center}
.landing-page .hero-trust li{flex:0 1 auto!important;min-width:0;font-size:clamp(8.5px,2.7cqw,12.5px)!important;padding:8px clamp(8px,2.4cqw,16px)!important;border-radius:999px!important;white-space:nowrap}
@media(prefers-reduced-motion:reduce){.ha *,.sc *,.lg *{animation:none!important}}
</style>

/* Alur: angka jadi badge ikon */
.flow-num{position:relative;width:60px!important;height:60px!important;border-radius:50%!important;box-shadow:0 12px 24px #c34c9a38!important}
.flow-num:before{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px dashed #e0b8ee;animation:haSpin 16s linear infinite}

.flow-step:nth-child(2) .flow-num{background:linear-gradient(135deg,#b6a6fa,#6b83e7)!important}
.flow-step:nth-child(3) .flow-num{background:linear-gradient(135deg,#7fe3c3,#2bb596)!important}
.flow-step:nth-child(4) .flow-num{background:linear-gradient(135deg,#ffd27a,#ff8a5c)!important}
